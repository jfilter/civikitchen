# Fixture for the sibling-wiring gate: `bait` is the bespoke checkout again,
# with a comment that names the private-deps action it deliberately does not
# use. A checker reading the raw job text passes it.
name: Fixture
on: workflow_call

jobs:
  bait:
    runs-on: ubuntu-latest
    steps:
      # not using private-deps here
      - name: Check out the sibling extension
        if: ${{ inputs.sibling_repo != '' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ inputs.sibling_repo }}
          path: .civikitchen-siblings/sibling
