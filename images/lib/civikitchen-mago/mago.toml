# The CiviKitchen mago baseline, shipped in the image — the same deal as the
# bundled phpcs standard and the ESLint baseline. A repo that commits its own
# mago.toml wins outright; ckfmt and cklint then drop this file.
#
# [formatter] exists for one property, verified empirically before it shipped:
# code formatted with it produces ZERO findings under the bundled CiviKitchen
# phpcs standard (Drupal-based). Formatter and lint gate must never disagree,
# or --fix and --check chase each other forever. If a mago upgrade ever breaks
# that property, the fix belongs here (one more setting), not in the phpcs
# ruleset.
#
# [linter] is cklint's second engine: the bug-pattern rules the phpcs standard
# does not carry. The rule set is subtractive — mago's defaults minus anything
# that overlaps another gate or fights the CiviCRM house idiom, one tool per
# question. Single deliberate deviations in code are `// @mago-expect
# lint:<rule>` lines, visible in the diff.
#
# No [source] section on purpose: mago's own file discovery finds nothing
# without configured paths, so ckfmt/cklint always pass an explicit file list —
# which is also where vendored and generated code gets filtered out.

[formatter]
# Drupal preset: 2-space indent, same-line braces, uppercase TRUE/FALSE/NULL —
# the shape the phpcs standard checks.
preset = "drupal"
# The one thing the preset gets wrong for our gate: phpcs wants
# `declare(strict_types = 1)`, the preset emits `strict_types=1`.
space-around-assignment-in-declare = true

[linter]
# mago's default only fails on error-level findings — but a rule worth
# running is worth gating on, so fail on everything it reports.
minimum-fail-level = "note"

[linter.rules]
# Formatting, layout, and naming: ckfmt and the phpcs Drupal standard own
# these; a second opinion here could only agree or contradict.
array-style = { enabled = false }
block-statement = { enabled = false }
class-name = { enabled = false }
constant-name = { enabled = false }
enum-name = { enabled = false }
file-name = { enabled = false }
function-name = { enabled = false }
interface-name = { enabled = false }
invalid-open-tag = { enabled = false }
lowercase-keyword = { enabled = false }
lowercase-type-hint = { enabled = false }
no-closing-tag = { enabled = false }
no-hash-comment = { enabled = false }
no-php-tag-terminator = { enabled = false }
no-short-opening-tag = { enabled = false }
no-trailing-space = { enabled = false }
trait-name = { enabled = false }

# Covered by another gate already: Slevomat enforces declare(strict_types),
# the Rector rule + NameBooleanArguments sniff own named-argument policy,
# cktaint owns taint analysis, spaze/disallowed-calls owns banned functions.
strict-types = { enabled = false }
literal-named-argument = { enabled = false }
tainted-data-to-sink = { enabled = false }
no-debug-symbols = { enabled = false }
disallowed-functions = { enabled = false }

# isset()/empty() on untyped, nested CiviCRM API arrays is the house idiom;
# the ??/array_key_exists rewrites these demand are not semantics-preserving.
no-empty = { enabled = false }
no-isset = { enabled = false }

# There is no TODO(#ticket) convention in these repos to enforce.
tagged-todo = { enabled = false }
tagged-fixme = { enabled = false }
