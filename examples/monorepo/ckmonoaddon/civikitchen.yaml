"$schema": https://raw.githubusercontent.com/jfilter/civikitchen/main/packages/civikitchen-scenario-schema/scenario.schema.json
version: 1
scenario:
  name: ckmonoaddon
  image: ghcr.io/jfilter/civikitchen:v1
  database:
    image: mariadb:11.4
  extension:
    key: de.civico.ckmonoaddon
    path: .
  credentials_output: file
  checks:
    - conform
    - lint
    - format
    - compatibility
    - dependencies
    - javascript
    - test
    - coverage
    - lifecycle
    - smarty
    - taint

policy:
  release:
    mode: none
    reason: fixture for the monorepo self-test, never published
