# Early warning for the generated catalogs: regenerate them against the LATEST
# CiviCRM release and diff. The drift gates in `make test` only prove the
# committed catalogs match their PINNED release — core moving on (new hooks,
# namespaces, API entities, schema) is invisible until someone bumps the pin
# and gets surprised. This run fails when the latest release would change a
# catalog beyond its version line, which is the moment to schedule the bump.
#
# A newer release that changes NOTHING but the version line is a pass: bumping
# for it would churn four files for no behavioural difference.
name: Catalog Preview

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stable releases only — X.Y.Z, no alpha/beta/RC tags. `sort -V` puts the
      # newest last.
      - name: Resolve the latest stable core release
        id: latest
        run: .github/scripts/catalog-resolve-latest.sh

      - name: Regenerate all four catalogs against the latest release
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: .github/scripts/catalog-regenerate.sh

      - name: Diff beyond the version line
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
          PINNED: ${{ steps.latest.outputs.pinned }}
        run: .github/scripts/catalog-diff.sh
