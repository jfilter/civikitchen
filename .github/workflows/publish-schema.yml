# Publish packages/civicrm-profile-schema to GitHub Packages (@jfilter scope).
# Trigger by pushing a tag like `civicrm-profile-schema-v0.1.0`. Keep the tag
# version in sync with the package.json version. Uses the built-in GITHUB_TOKEN
# (packages: write) — no extra secret.
name: publish-schema

on:
  push:
    tags:
      - 'civicrm-profile-schema-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@jfilter'
      - name: publish
        run: npm publish
        working-directory: packages/civicrm-profile-schema
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
