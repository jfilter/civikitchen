name: Standalone Playwright E2E

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing the Playwright project
        type: string
        default: 'tests/e2e'
      node_version:
        description: Node.js major used by the test project
        type: string
        default: '24'
      cache_dependency_path:
        description: Path to the E2E package-lock.json
        type: string
        default: 'tests/e2e/package-lock.json'
      install_command:
        description: Optional dependency installation command
        type: string
        default: ''
      browser_install_command:
        description: Optional Playwright browser installation command
        type: string
        default: ''
      prepare_command:
        description: Optional build or stack-setup command
        type: string
        default: ''
      test_command:
        description: Playwright test command
        type: string
        default: 'npx playwright test'
      failure_command:
        description: Optional diagnostic command run after a failure
        type: string
        default: ''
      cleanup_command:
        description: Optional cleanup command, always run last
        type: string
        default: ''
      base_url:
        description: Optional BASE_URL exposed to the tests
        type: string
        default: ''
      artifact_paths:
        description: Newline-separated artifact paths, relative to repository root
        type: string
        default: |-
          tests/e2e/playwright-report/
          tests/e2e/test-results/
      artifact_retention_days:
        description: Number of days to retain Playwright artifacts
        type: number
        default: 7
      timeout_minutes:
        description: Maximum runtime for the E2E job
        type: number
        default: 30
      runs_on:
        description: Runner label override
        type: string
        default: ''
      sibling_repo:
        description: >-
          Second extension repo (`owner/repo`) checked out to
          .civikitchen-siblings/ and mounted read-only beside this one, under
          the key from ITS info.xml — for extensions implementing a sibling's
          interfaces. Mounted as-is (no composer install there); private
          sibling needs the composer_app_* secrets. Empty mounts nothing.
        type: string
        default: ''
      composer_app_repositories:
        description: >-
          Comma- or newline-separated repository names within the caller's
          owner that the GitHub App token may read. Required whenever the app
          secrets are supplied for private Composer packages or a private
          sibling; list only the repositories actually needed by this run.
        type: string
        default: ''

    secrets:
      composer_app_id:
        description: >-
          App ID of a GitHub App with `contents: read`, installed on the
          private dependency repos (composer packages, sibling). Optional —
          without it composer resolves what is public and the sibling checkout
          uses the caller-scoped token (404 for private).
        required: false
      composer_app_private_key:
        description: >-
          Private key (PEM) of that app. Used once on the runner to mint a
          short-lived installation token; never enters a container.
        required: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      # One compose project per CALL, not per run: a caller that runs this
      # workflow twice in one run (two identity providers, say) lands both
      # copies on the same Docker host of a multi-slot self-hosted runner, and
      # with one shared name the first `down` kills the other job's stack.
      # The test command is what differs between the calls.
      - name: Compose project name
        env:
          CK_COMMAND: ${{ inputs.test_command }}
        run: |
          suffix=$(printf '%s' "$CK_COMMAND" | sha256sum | cut -c1-8)
          echo "COMPOSE_PROJECT_NAME=ck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pw-${suffix}" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Validate inputs
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        run: |
          [[ "$CK_SIBLING_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo "invalid sibling_repo (expected owner/repo): $CK_SIBLING_REPO" >&2; exit 1; }

      # Branching on the secret in bash, not the step's `if:` — the `secrets`
      # context is not available there.
      - name: Decide whether a private-dependency token is needed
        id: need-token
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_COMPOSER_APP_ID: ${{ secrets.composer_app_id }}
          CK_COMPOSER_APP_PRIVATE_KEY: ${{ secrets.composer_app_private_key }}
          CK_COMPOSER_APP_REPOSITORIES: ${{ inputs.composer_app_repositories }}
        run: |
          set -euo pipefail
          if [ -n "${CK_COMPOSER_APP_ID:-}" ] && [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
            if [ -z "${CK_COMPOSER_APP_REPOSITORIES//[[:space:],]/}" ]; then
              echo "composer_app_repositories must list the repositories readable by the app token" >&2
              exit 1
            fi
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      # `repositories:` scopes the token to composer_app_repositories, the
      # caller-declared least-privilege set — never the app's full install.
      - name: Mint a read token for private dependencies
        id: app
        if: ${{ steps.need-token.outputs.app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.composer_app_id }}
          private-key: ${{ secrets.composer_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.composer_app_repositories }}
          # The token only ever reads the sibling checkout over HTTPS.
          permission-contents: read

      - name: Resolve the sibling checkout path
        id: sibling
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        run: |
          set -euo pipefail
          echo "path=.civikitchen-siblings/${CK_SIBLING_REPO##*/}" >> "$GITHUB_OUTPUT"

      # Leading dot: CiviCRM's extension scanner skips dot-directories, so the
      # sibling is not discovered a second time through the caller's own mount.
      - name: Check out the sibling extension
        if: ${{ inputs.sibling_repo != '' }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: ${{ inputs.sibling_repo }}
          token: ${{ steps.app.outputs.token || github.token }}
          path: ${{ steps.sibling.outputs.path }}

      # Mounts the sibling read-only; CIVIKITCHEN_ENABLE_EXTENSIONS is
      # caller-owned since this workflow does not know the stack's own list.
      - name: Compose override — mount the sibling
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_DIR: ${{ steps.sibling.outputs.path }}
        run: |
          set -euo pipefail
          info="$GITHUB_WORKSPACE/$CK_SIBLING_DIR/info.xml"
          [ -f "$info" ] \
            || { echo "sibling_repo: no info.xml in $CK_SIBLING_DIR — that repo is not a CiviCRM extension" >&2; exit 1; }
          # shellcheck disable=SC2016  # the $vars belong to PHP, not the shell.
          sibling_key=$(php -r '
            libxml_use_internal_errors(TRUE);
            $xml = simplexml_load_file($argv[1]);
            if ($xml === FALSE) { fwrite(STDERR, "cannot parse {$argv[1]}\n"); exit(2); }
            echo trim((string) $xml["key"]);
          ' "$info")
          [[ "$sibling_key" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]] \
            || { echo "sibling_repo: could not read a usable extension key from $CK_SIBLING_DIR/info.xml (got: '$sibling_key')" >&2; exit 1; }
          echo "sibling extension: $sibling_key (from $CK_SIBLING_DIR)"
          override="$RUNNER_TEMP/civikitchen-sibling-override.yml"
          cat > "$override" <<YAML
          services:
            app:
              volumes:
                - $GITHUB_WORKSPACE/$CK_SIBLING_DIR:/var/www/html/ext/$sibling_key:ro
          YAML
          {
            echo "CK_SIBLING_DIR=$GITHUB_WORKSPACE/$CK_SIBLING_DIR"
            echo "CK_SIBLING_KEY=$sibling_key"
            echo "CK_SIBLING_OVERRIDE=$override"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache_dependency_path }}

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.install_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Install Playwright browsers
        if: ${{ inputs.browser_install_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.browser_install_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Prepare test environment
        if: ${{ inputs.prepare_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.prepare_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Run Playwright tests
        env:
          CK_COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Diagnostics on failure
        if: ${{ failure() && inputs.failure_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.failure_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ inputs.artifact_paths }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Clean up test environment
        if: ${{ always() && inputs.cleanup_command != '' }}
        env:
          CK_COMMAND: ${{ inputs.cleanup_command }}
        run: bash -euo pipefail -c "$CK_COMMAND"

      # Tests that run inside Docker leave root-owned reports and bind-mount
      # directories behind. On a self-hosted runner the next actions/checkout
      # cannot delete those and the whole job fails before it starts — hand
      # the workspace back to the runner user, with the same Docker that
      # created the files (no sudo needed).
      - name: Restore workspace ownership
        if: ${{ always() }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace
