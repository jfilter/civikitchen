# The one release definition every conforming extension repo calls, so a
# release is the same act everywhere: check the version, build the installable
# zip, install it into a real CiviCRM, publish.
#
#   name: Release
#   on:
#     push:
#       tags: ['v[0-9]+.[0-9]+.[0-9]+']
#   permissions:
#     contents: read
#   jobs:
#     release:
#       permissions:
#         contents: write        # the called workflow can only narrow this
#       uses: jfilter/civikitchen/.github/workflows/extension-release.yml@v1
#
# Pin the major (@v1), not @main — same versioned contract as extension-ci.yml
# (docs/releases.md).
#
# NOT a version bumper: the bump is a commit an author writes and reviews, the
# tag is the statement that it is ready. Why not release-please, and what the
# archive contents promise: docs/extension-releases.md, and ckrelease's header.
name: Extension Release

on:
  workflow_call:
    inputs:
      image:
        description: >-
          CiviKitchen image the install smoke test runs in. Defaults to the
          released contract image, the same one the CI compose stack pins.
        type: string
        default: 'ghcr.io/jfilter/civikitchen:v1'
      smoke_test:
        description: >-
          Install the built archive into a fresh CiviCRM before publishing.
          Turn off only for an extension whose install cannot be reached this
          way (and say so in the caller).
        type: boolean
        default: true
      require_changelog:
        description: 'Fail when the repo has no CHANGELOG.md at all'
        type: boolean
        default: false
      draft:
        description: 'Publish the GitHub release as a draft'
        type: boolean
        default: false
      runs_on:
        description: Runner label override for all release jobs
        type: string
        default: ''
      composer_install:
        description: >-
          Install locked production dependencies and include the generated
          vendor/ tree in the archive. Use when vendor/ is not committed but
          the extension requires vendor/autoload.php at runtime.
        type: boolean
        default: false
      composer_app_repositories:
        description: >-
          Comma- or newline-separated repository names within the caller's
          owner that the GitHub App token may read. Required whenever the app
          secrets are supplied for private Composer packages.
        type: string
        default: ''

    secrets:
      composer_app_id:
        description: >-
          App ID of a GitHub App with `contents: read`, installed on the
          private Composer package repos. Optional — without it composer
          resolves what is public.
        required: false
      composer_app_private_key:
        description: >-
          Private key (PEM) of that app. Used on the runner only to mint a
          short-lived token; never copied into the archive or smoke container.
        required: false

permissions:
  contents: read

jobs:
  dist:
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      COMPOSE_PROJECT_NAME: ck-${{ github.run_id }}-${{ github.run_attempt }}-release
      # Inputs reach the shell through the environment, never through expression
      # interpolation inside `run:` — an interpolated input IS the script text.
      # Read by the smoke stack's ${CIVIKITCHEN_IMAGE} on every compose call,
      # not just `up` — an unset variable there resolves to an empty image.
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
      CK_REQUIRE_CHANGELOG: ${{ inputs.require_changelog }}
      CK_RELEASE_REF: HEAD
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The archive is built from the tag, so there has to be one. A branch push
      # that reached this workflow would otherwise publish a release named after
      # the branch.
      - name: Require a tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) echo "releasing $GITHUB_REF_NAME" ;;
            *) echo "extension-release only runs on a tag push (got $GITHUB_REF)" >&2; exit 1 ;;
          esac

      # Pinned to the SHA this workflow was resolved from, so the ckrelease that
      # builds the artifact is the one belonging to the pinned contract — same
      # mechanism the drift job in extension-ci.yml uses.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          repository: jfilter/civikitchen
          ref: ${{ job.workflow_sha }}
          path: .civikitchen-ci

      - name: Install the locked CiviKitchen configuration parser
        run: |
          composer install --no-dev --no-interaction --no-progress --classmap-authoritative \
            --working-dir=.civikitchen-ci/packages/civikitchen-scenario-schema

      # Branching on the secret in bash — the `secrets` context is not
      # available in `if:`. No app means every required package is public.
      - name: Decide whether a private-dependency token is needed
        id: need-token
        if: ${{ inputs.composer_install }}
        env:
          CK_COMPOSER_APP_ID: ${{ secrets.composer_app_id }}
          CK_COMPOSER_APP_PRIVATE_KEY: ${{ secrets.composer_app_private_key }}
          CK_COMPOSER_APP_REPOSITORIES: ${{ inputs.composer_app_repositories }}
        run: |
          set -euo pipefail
          if [ -n "${CK_COMPOSER_APP_ID:-}" ] && [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
            if [ -z "${CK_COMPOSER_APP_REPOSITORIES//[[:space:],]/}" ]; then
              echo "composer_app_repositories must list the repositories readable by the app token" >&2
              exit 1
            fi
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a read token for private dependencies
        id: app
        if: ${{ steps.need-token.outputs.app == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.composer_app_id }}
          private-key: ${{ secrets.composer_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.composer_app_repositories }}
          # The token only ever reads: a sibling checkout and composer's
          # private packages over HTTPS. Nothing here writes with it.
          permission-contents: read

      - name: Bundle locked production dependencies
        if: ${{ inputs.composer_install }}
        env:
          # The app token for private packages, else the run's own token: an
          # unauthenticated runner hits GitHub's API rate limit on dist
          # downloads and composer silently falls back to source clones.
          CK_COMPOSER_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          # Private packages are declared by https://github.com/... URL; the
          # token goes in as Composer's github-oauth credential.
          composer config -g github-oauth.github.com "$CK_COMPOSER_TOKEN"

          # The lockfile is the dependency input; do not update it and do not
          # bypass its PHP requirements. Repositories whose runtime PHP is newer
          # than the runner declare config.platform.php, as in extension CI.
          composer install --no-dev --no-interaction --no-progress
          test -f vendor/autoload.php \
            || { echo 'composer_install produced no vendor/autoload.php' >&2; exit 1; }

          # Apply ckrelease's one authoritative exclusion policy to development
          # directories and config files nested inside Composer packages.
          while IFS=' ' read -r kind relpath; do
            case "$kind" in
              dir)
                find vendor -type d -path "*/$relpath" -prune -exec rm -rf -- {} +
                ;;
              file)
                find vendor -type f -path "*/$relpath" -delete
                ;;
            esac
          done < <(php .civikitchen-ci/toolbelt/bin/ckconform --dist-paths)

          # A package composer installed from source carries its own .git;
          # `git add` would record that as a gitlink (an empty entry in the
          # archive) instead of the package's files. Strip them first.
          find vendor -name .git -prune -exec rm -rf -- {} +

          # ckrelease archives Git objects, never a mutable working tree. Add
          # vendor/ only to the disposable Actions index and archive that tree;
          # the pushed tag itself remains untouched.
          git add -f vendor
          echo "CK_RELEASE_REF=$(git write-tree)" >> "$GITHUB_ENV"

      - name: Build the distribution archive
        id: build
        env:
          # Outside the checkout on purpose: an extension repo may well track its
          # own dist/ (a committed frontend build), and the release artifact must
          # not land in the tree the archive is built from.
          CK_DIST: ${{ runner.temp }}/ckrelease
        run: |
          set -euo pipefail
          args=()
          if [ "$CK_REQUIRE_CHANGELOG" = 'true' ]; then
            args+=(--require-changelog)
          fi
          # dist runs the consistency check itself and refuses to build without
          # it, so there is no way to publish an archive that skipped it.
          php .civikitchen-ci/toolbelt/bin/ckrelease dist \
            --version "$GITHUB_REF_NAME" --ref "$CK_RELEASE_REF" --output "$CK_DIST" "${args[@]}"
          {
            echo "key=$(php .civikitchen-ci/toolbelt/bin/ckrelease info key)"
            echo "zip=$CK_DIST/$(php .civikitchen-ci/toolbelt/bin/ckrelease info dist-name)"
          } >> "$GITHUB_OUTPUT"

      # A release archive that has never been installed is a guess. This is the
      # same stack extension-ci.yml runs in, minus the source mount: the site
      # only ever sees the zip, which is what a user gets.
      - name: Install smoke test
        if: ${{ inputs.smoke_test }}
        env:
          CK_EXT_KEY: ${{ steps.build.outputs.key }}
          CK_DIST: ${{ runner.temp }}/ckrelease
          CK_POLICY_DIR: ${{ runner.temp }}/ckrelease-policy
        run: |
          set -euo pipefail
          # The archive carries no civikitchen.yaml (a dev file, excluded by the
          # central list), but the <requires> resolver reads extension_source
          # pins from it. Its own directory, not $CK_DIST: that one is uploaded
          # as the release artifact. A directory mount is fine when the file
          # does not exist; a file mount would silently create a directory.
          mkdir -p "$CK_POLICY_DIR"
          if [ -f civikitchen.yaml ]; then cp civikitchen.yaml "$CK_POLICY_DIR/"; fi
          cat > smoke-compose.yml <<'YAML'
          name: ckrelease-smoke
          services:
            app:
              image: ${CIVIKITCHEN_IMAGE}
              pull_policy: always
              depends_on:
                db:
                  condition: service_healthy
              environment:
                CIVICRM_AUTO_INSTALL: "1"
                CIVICRM_DB_HOST: db
                CIVICRM_DB_NAME: civicrm
                CIVICRM_DB_USER: civicrm
                CIVICRM_DB_PASSWORD: civicrm
                CIVIKITCHEN_SITE_URL: "http://localhost:8080"
              volumes:
                - ${CK_DIST}:/ck-dist:ro
                - ${CK_POLICY_DIR}:/ck-policy:ro
            db:
              image: mariadb:10.11
              environment:
                MYSQL_ROOT_PASSWORD: root
                MYSQL_DATABASE: civicrm
                MYSQL_USER: civicrm
                MYSQL_PASSWORD: civicrm
              healthcheck:
                test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
                interval: 5s
                timeout: 5s
                retries: 10
          YAML
          docker compose -f smoke-compose.yml up -d --wait --quiet-pull

          # Unzip as root: the extension directory is the image's, not ours.
          # CK_EXT_DIR is where the image puts extensions (docker/runtime/provision.sh).
          docker compose -f smoke-compose.yml exec -T \
            -e "CK_EXT_KEY=$CK_EXT_KEY" app bash -c '
            set -eu
            mkdir -p "${CK_EXT_DIR:-/var/www/html/ext}"
            unzip -q -o /ck-dist/*.zip -d "${CK_EXT_DIR:-/var/www/html/ext}"
            if [ -f /ck-policy/civikitchen.yaml ]; then
              cp /ck-policy/civikitchen.yaml "${CK_EXT_DIR:-/var/www/html/ext}/$CK_EXT_KEY/civikitchen.yaml"
            fi
            chown -R www-data:www-data "${CK_EXT_DIR:-/var/www/html/ext}"'

          # Rescan the container so the new directory is known, resolve the
          # info.xml <requires> the way the entrypoint does for a mounted
          # extension (registry download, or the extension_source pin), then
          # install for real — this is where a missing <requires>, a broken
          # upgrader or a PHP file the exclude list swallowed by mistake
          # actually shows up. provision.sh is sourced for its functions only;
          # this exec already runs as the web user, so ck_as_web is a no-op.
          docker compose -f smoke-compose.yml exec -T -u www-data \
            -e "CK_EXT_KEY=$CK_EXT_KEY" app bash -c '
            set -eu
            cv ev "CRM_Extension_System::singleton()->getFullContainer()->refresh();"
            ck_as_web() { "$@"; }
            . /usr/local/share/civikitchen/provision.sh
            ck_resolve_requires "$CK_EXT_KEY"
            cv ext:enable "$CK_EXT_KEY"'

          # Same status assertion the lifecycle smoke in extension-ci.yml uses:
          # `cv ext:enable` can succeed on a site where the extension still ends
          # up something other than installed.
          status=$(docker compose -f smoke-compose.yml exec -T -u www-data \
            -e "CK_EXT_KEY=$CK_EXT_KEY" app bash -c \
            'cv ev "echo CRM_Extension_System::singleton()->getManager()->getStatus(getenv(\"CK_EXT_KEY\"));"' \
            | tr -d '[:space:]')
          [ "$status" = installed ] \
            || { echo "smoke: extension ended up [$status], expected [installed]" >&2; exit 1; }

      # A failed stack is a stack trace of nothing without its logs.
      - name: App logs on failure
        if: ${{ failure() && inputs.smoke_test }}
        run: |
          [ -f smoke-compose.yml ] || exit 0
          docker compose -f smoke-compose.yml logs app | tail -200

      - name: Upload the archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ckrelease-dist
          path: ${{ runner.temp }}/ckrelease/
          if-no-files-found: error

  publish:
    needs: dist
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    # The only job that writes anything, and the only one with a token that can.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ckrelease-dist
          path: ckrelease-dist

      # --generate-notes is the delegation the issue asked for: GitHub already
      # writes decent notes from merged PRs, and a release that exists is
      # re-runnable (upload --clobber) instead of erroring on the second try.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CK_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CK_DRAFT" = 'true' ]; then
            args+=(--draft)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists — replacing its assets"
            gh release upload "$GITHUB_REF_NAME" ckrelease-dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              "${args[@]}" ckrelease-dist/*
          fi
