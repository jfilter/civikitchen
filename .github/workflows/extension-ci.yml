# The one CI definition every civico extension calls, so the pipeline lives in
# one place instead of drifting between eleven copy-pasted workflows. A calling
# repo's own workflow is a few lines:
#
#   jobs:
#     ci:
#       uses: jfilter/civikitchen/.github/workflows/extension-ci.yml@v1
#       with:
#         key: <extension-key>
#
# Pin the major (@v1), not @main: workflow, template, ck* tools and images are
# released as one versioned contract, so a caller moves deliberately instead of
# with every push here. The canary repo is the exception — see
# docs/releases.md.
#
# Beyond that default run the workflow has opt-in extras. The slow ones — a
# compatibility matrix over further CiviCRM images, a lifecycle smoke test, an
# upgrade-from-the-last-release test, a core-upgrade persistence test and a
# Playwright browser job — are off
# unless asked for, and they belong in a second, scheduled caller rather than
# in the push run: docs/extension-standards.md ("Compatibility: test the range
# you claim") has the reasoning and a ready-made compat.yml. The cheap ones are
# the frontend steps (npm_ci, js_tests, and `bun` to run them with Bun instead
# of npm): seconds on the runner, and they belong in the push run —
# docs/extension-standards.md ("Frontend: JS dependencies, JS tests and browser
# tests").
#
# civikitchen is public, so any repo can call this without a cross-repo token.
# A repo whose dependencies are NOT public is the one case that needs more than
# `with:` — a repo that keeps vendor/ out of git, or that needs a private
# sibling extension mounted beside itself, passes read-only deploy keys through
# the `secrets:` block: docs/extension-standards.md ("Private dependencies").
# Everything runs inside the extension's own CiviCRM stack: the standalone image
# auto-installs, enables the mounted extension and seeds the civicrm_test scratch
# DB, and cklint / ckconform / phpstan / ckcoverage / cktaint all ship in that
# image (cktaint is advisory — it can never fail the run). The
# coverage floor comes from the repo's .ckconform, so it needs no input here.
# The two exceptions run on the bare runner because they have nothing to ask a
# CiviCRM about: the template-drift check, and the lockfile vulnerability scan
# (osv-scanner) — docs/extension-standards.md ("Known vulnerabilities").
name: Extension CI

on:
  workflow_call:
    inputs:
      key:
        description: 'Extension key — the directory it mounts to under /var/www/html/ext'
        required: true
        type: string
      compose_file:
        description: 'Compose file that brings up the CiviCRM stack'
        type: string
        default: '.docker/docker-compose.ci.yml'
      check_template:
        description: 'Fail when template-managed files drift from civikitchen (ckinit --check)'
        type: boolean
        default: true
      image:
        description: >-
          Override the compose stack's CiviKitchen image. Empty (the default)
          leaves the compose file's own ${CIVIKITCHEN_IMAGE:-...} default in
          place. Lets a caller pin or float the image without editing the
          template-managed CI compose file — how the canary repo tracks
          :standalone while the fleet is on :v1.
        type: string
        default: ''
      matrix_images:
        description: >-
          Compatibility matrix: comma-separated image tags, one stack boot and
          full suite each — typically oldest claimed minor plus newest. Empty
          adds no jobs. Weekly caller, not the push run.
        type: string
        default: ''
      lifecycle:
        description: >-
          After the suite, exercise the extension lifecycle in the running
          stack: disable → re-enable → uninstall → install. Catches the half
          of the upgrader that inspection and green tests never reach.
        type: boolean
        default: false
      upgrade_from_last_release:
        description: >-
          Install the newest reachable git tag first, then swap the working
          tree to this commit and run the extension DB upgrade — the path
          every existing site takes, which a fresh install never exercises.
          Needs at least one reachable tag and a compose file that already
          existed at that tag; both are checked and reported, not skipped.
        type: boolean
        default: false
      schema_parity:
        description: >-
          Schema-parity job: install the last release and upgrade it to HEAD,
          then install HEAD fresh, and diff the two schemas over the
          extension's OWN tables. Answers what the upgrade job cannot — the
          upgrader ran, but did it ARRIVE where install() does. Two stack boots
          on one runner; scheduled caller, not the push run. Skips itself with
          a log line when the extension declares no tables or nothing has been
          released yet.
        type: boolean
        default: false
      core_upgrade_from:
        description: >-
          Core-upgrade persistence job: install on THIS image, seed, move the
          same DB to the run's normal image, `cv upgrade:db`. Must be the OLDER
          version — the job fails when both resolve to the same core. Optional
          fixtures tests/upgrade/seed.php|assert.php via `cv scr`. Empty skips
          the job. Slowest check: scheduled caller only. See
          docs/extension-standards.md.
        type: string
        default: ''
      npm_ci:
        description: >-
          `npm ci --ignore-scripts` on the runner before the stack boots, so
          the bind-mounted checkout has node_modules/. Needs the committed
          package-lock.json; dependency install scripts stay off on purpose.
        type: boolean
        default: false
      js_tests:
        description: >-
          Run `npm test` (implies npm_ci). Fails when package.json declares no
          test script — an opt-in that silently tests nothing is worse.
        type: boolean
        default: false
      bun:
        description: >-
          Drive all frontend steps with Bun (`bun install --frozen-lockfile`,
          `bun run test` / `test:e2e`) instead of npm — whole pipeline or
          none. Needs a committed bun.lock. node_version still applies: the
          installed binaries run on Node. See docs/extension-standards.md.
        type: boolean
        default: false
      mutation:
        description: >-
          Mutation testing (infection via `ckmutate`) as its own job: does the
          suite ASSERT on what it covers. Slow and its score moves with
          unrelated refactors, so it is a SCHEDULED signal, never a push gate.
          A no-op unless the repo sets mutation_min_msi in .ckconform.
        type: boolean
        default: false
      playwright:
        description: >-
          Browser tests as their own job: stack with published HTTP port and
          demo login, then `npm run test:e2e`. Slow — scheduled caller only.
        type: boolean
        default: false
      runs_on:
        description: >-
          Runner label for all jobs. Resolution: this input, else the caller's
          CK_RUNS_ON repo/org variable, else 'ubuntu-latest' — one variable
          flips a whole fleet. NEVER attach self-hosted runners to a public
          repo (fork PRs run arbitrary code). Host needs Docker + php-cli with
          SimpleXML.
        type: string
        default: ''
      node_version:
        description: >-
          Node version for every frontend step above and for the Playwright
          job. Only read when one of them is switched on, and still read under
          `bun`: Bun replaces the package manager, not the Node toolchain the
          installed binaries run on. Tracks the Node the dev images ship
          (images/*/Dockerfile) — a browser job testing on a different major
          than the image serves is a gap, not a safety margin.
        type: string
        default: '24'
      composer_install:
        description: >-
          `composer install --no-dev` on the runner before the stack boots —
          a repo without committed vendor/ cannot even enable the extension
          otherwise. On the runner (not in-container) so the deploy key never
          enters a container; the image's auto-composer sees vendor/ and skips.
        type: boolean
        default: false
      sibling_repo:
        description: >-
          Second extension repo (`owner/repo`) checked out to
          .civikitchen-siblings/ and mounted read-only beside this one, under
          the key from ITS info.xml — for extensions implementing a sibling's
          interfaces. Mounted as-is (no composer install there); private
          sibling needs sibling_deploy_key. Empty mounts nothing.
        type: string
        default: ''

    secrets:
      composer_deploy_key:
        description: >-
          Read-only deploy key for the private composer package; used only by
          ssh(1) on the runner (IdentitiesOnly), never enters a container.
          Optional — without it composer resolves what is public.
        required: false
      sibling_deploy_key:
        description: >-
          Read-only deploy key for a private sibling_repo. Optional — without
          it the checkout uses the caller-scoped token (404 for private).
        required: false

permissions:
  contents: read

jobs:
  # Template drift: the tooling files civikitchen owns (CI caller, test
  # bootstraps, CI compose stack) must match the template, or
  # eleven repos quietly diverge again — the exact state the shared workflow
  # exists to end. Deliberate deviations are declared in the repo's .ckconform
  # (template_custom=<file> -- <reason>); the fix for everything else is one
  # `tools/ckinit.php --update` away.
  template:
    if: ${{ inputs.check_template }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the SHA this very workflow was resolved from, so the template
      # under comparison is the one belonging to the pipeline that is running —
      # an unpinned second checkout could race a push to main in between.
      # job.workflow_sha (not github.workflow_sha, which is the CALLER's file)
      # is the official way for a reusable workflow to reach its own repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: jfilter/civikitchen
          ref: ${{ job.workflow_sha }}
          path: .civikitchen-ci
      - name: Check template drift (ckinit --check)
        run: php .civikitchen-ci/tools/ckinit.php --check .

  # Known vulnerabilities in the dependencies the repo actually ships. Read from
  # the committed lockfiles, not from the ranges in composer.json/package.json:
  # a range says what *could* be installed, the lock says what CI resolved and
  # what every install got — and the lockfile rule in
  # docs/extension-standards.md is what makes that file exist to be scanned.
  #
  # Its own job, and one that boots no CiviCRM stack: it has nothing to do with
  # the extension's code, so it should not queue behind a container, and a fresh
  # advisory must not hide a red PHPUnit. Same reasoning as the independent
  # gates inside `ci`.
  #
  # Deliberately not an opt-in input. An advisory published overnight can turn
  # the whole fleet red without a single commit, which is uncomfortable and also
  # the entire point; the escape hatch is per finding (osv-scanner.toml, see the
  # scan step), not per repo — a switch that turns the gate off is one nobody
  # ever turns back on.
  osv:
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned version AND pinned checksum. Pinning the version alone still
      # trusts whatever that release tag serves on the day the job runs, and
      # this step executes on every push in eleven repos. The hashes are the
      # release's own osv-scanner_SHA256SUMS entries; a version bump moves both.
      #
      # Both Linux architectures, because runs_on can point at a self-hosted
      # arm64 host. Anything else is named and fails rather than quietly
      # scanning nothing.
      - name: Install osv-scanner
        env:
          CK_OSV_VERSION: v2.4.0
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)
              asset=osv-scanner_linux_amd64
              sha=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
              ;;
            Linux/aarch64)
              asset=osv-scanner_linux_arm64
              sha=44e580752910f0ff36ec99aff59af20f65df1e859aa31e5605a8f0d055b496e9
              ;;
            *)
              echo "no pinned osv-scanner build for $(uname -s)/$(uname -m) — this job needs a Linux runner" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/$CK_OSV_VERSION/$asset"
          echo "$sha  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      # Named lockfiles at the repository ROOT, one -L each, instead of letting
      # the scanner walk the tree: a directory scan also finds the lockfiles
      # inside vendor/ and node_modules/ once a previous step has materialized
      # them, and a dependency's own lockfile is not what this repo ships.
      #
      # A repo with none of the three is a normal, common state (a PHP-only
      # extension with no real composer dependencies), so it passes — but it
      # says so in one line. `osv-scanner scan source` on a tree with no
      # package source exits 128 unless told otherwise, which is why the empty
      # case is answered here rather than by --allow-no-lockfiles: a step that
      # prints what it did NOT scan is the difference between an honest pass
      # and a green tick over nothing.
      #
      # Exceptions live in an osv-scanner.toml in the repo root, which the
      # scanner picks up on its own because it sits beside the lockfiles — no
      # flag, no input here. It excuses a single advisory
      # ([[IgnoredVulns]] with id/reason and an ignoreUntil date that makes the
      # excuse expire) or a whole package ([[PackageOverrides]]), prints the
      # reason on every run, and reports ignores that no longer match anything.
      # docs/extension-standards.md has the shape.
      - name: Scan lockfiles for known vulnerabilities (osv-scanner)
        run: |
          set -euo pipefail
          args=()
          for lock in composer.lock package-lock.json bun.lock; do
            if [ -f "$lock" ]; then
              echo "scanning $lock"
              args+=(-L "$lock")
            fi
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "no composer.lock, package-lock.json or bun.lock in the repository root — no dependencies to scan"
            exit 0
          fi
          # 128 is osv-scanner's "no packages found" — a lockfile that locks
          # nothing (extension with no runtime deps) is a pass, not a failure.
          rc=0
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}" || rc=$?
          if [ "$rc" -eq 128 ]; then
            echo "osv-scanner found no packages in the scanned lockfiles — nothing to check"
            exit 0
          fi
          exit "$rc"

  ci:
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    # Inputs enter shell commands through the environment, never by expression
    # interpolation inside `run:` — an interpolated input IS the script text.
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      # Read by the compose file's ${CIVIKITCHEN_IMAGE:-<default>}; `:-` treats
      # the empty default as unset, so not passing `image` changes nothing.
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        env:
          CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }
          # Empty is the default and means "no sibling"; anything else has to
          # be owner/repo, because it becomes a checkout target and a path.
          [[ -z "$CK_SIBLING_REPO" || "$CK_SIBLING_REPO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo "invalid sibling_repo (expected owner/repo): $CK_SIBLING_REPO" >&2; exit 1; }

      # --- Frontend steps (opt-in via npm_ci / js_tests / bun) --------------
      #
      # js_tests implies npm_ci, and bun implies the install too: `npm test`
      # without an install is a red run about nothing, and a package manager
      # that installs nothing is not a choice worth making. Any of the three
      # switches these steps on. They sit BEFORE the stack boot on purpose:
      #   * the container reads node_modules/ through the bind mount, and the
      #     entrypoint enables the extension while booting — an asset bundle
      #     read during install has to find its files already there;
      #   * unit tests need no CiviCRM, so a red JS suite should cost a
      #     30-second install, not a stack boot first.
      #
      # Node is set up on BOTH paths. Bun replaces npm, not node: `bun run`
      # starts the repo's scripts, and what those scripts call — tsc, vitest,
      # playwright out of node_modules/.bin — is a `#!/usr/bin/env node`
      # shebang away from needing a Node on PATH.
      - name: Set up Node
        if: ${{ inputs.npm_ci || inputs.js_tests || inputs.bun }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          # The npm cache keys on package-lock.json and setup-node FAILS the
          # step when it finds none — which is exactly the Bun repo, where the
          # committed lockfile is bun.lock. Written `!x && 'npm' || ''` and not
          # the usual way round because a ternary whose first branch is the
          # empty string collapses into its second.
          cache: ${{ !inputs.bun && 'npm' || '' }}

      - name: Set up Bun
        if: ${{ inputs.bun }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # --ignore-scripts is deliberate and not configurable — see the input
      # description. A package that genuinely needs a build step should run it
      # as an explicit script from its `test`/`test:e2e` script, where it is
      # visible, rather than through an install hook.
      #
      # One step for both managers: what decides whether the tree is installed
      # at all is the same either way, and a second step is a second place for
      # that condition to drift.
      - name: Materialize JS dependencies (npm ci / bun install)
        if: ${{ inputs.npm_ci || inputs.js_tests || inputs.bun }}
        env:
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          if [ "$CK_USE_BUN" = true ]; then
            # No --ignore-scripts counterpart to add: Bun runs no dependency
            # lifecycle script at all unless it is a trustedDependency.
            bun install --frozen-lockfile
          else
            npm ci --ignore-scripts
          fi

      - name: JS unit tests (npm test / bun run test)
        if: ${{ inputs.js_tests }}
        env:
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          jq -e '.scripts.test // empty' package.json > /dev/null \
            || { echo "js_tests is on but package.json declares no \"test\" script — add one or turn the input off" >&2; exit 1; }
          if [ "$CK_USE_BUN" = true ]; then
            bun run test
          else
            npm test
          fi

      # --- Private dependencies (opt-in via composer_install / sibling_repo) --
      #
      # Both live BEFORE the stack boot for the same reason the frontend steps
      # do: the container sees the checkout through the bind mount, and the
      # entrypoint enables the extension *while booting*. Whatever enabling the
      # extension needs — its autoloader, a sibling it declares a requirement
      # on — has to be in the tree by then, not a step later.
      #
      # Deploy keys stay on the runner. Nothing here is mounted, copied or
      # passed into a container, and nothing echoes the key: the container gets
      # the *result* (a vendor/ directory, a checked-out sibling), never the
      # credential that produced it. A leaked build secret is otherwise the one
      # mistake in this pipeline that outlives the job.
      #
      # The sibling checkout goes FIRST, before any ~/.ssh/config exists. Two
      # deploy keys for github.com are ambiguous by nature: the server accepts
      # whichever valid key ssh offers first and only then decides the
      # repository is off limits, which surfaces as "repository not found" for
      # a repo the run has perfectly good access to. actions/checkout passes
      # its own key with `-i … -o IdentitiesOnly=yes`, so ordering the steps
      # this way keeps the question from arising at all.

      # Two steps rather than an expression: GitHub's expression language has
      # no split(), and what the checkout needs is the repo name — the part
      # after the slash — as a path.
      - name: Resolve the sibling checkout path
        id: sibling
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        run: |
          set -euo pipefail
          echo "path=.civikitchen-siblings/${CK_SIBLING_REPO##*/}" >> "$GITHUB_OUTPUT"

      # Inside the workspace, because actions/checkout refuses to write
      # anywhere else — and the LEADING DOT is load-bearing, twice over:
      #   * CiviCRM's extension scanner (CRM_Utils_File::findFiles, via
      #     CRM_Extension_Container_Basic) skips any directory whose name
      #     starts with a dot. Without that, the sibling would be discovered a
      #     second time *through the extension's own mount* and the same key
      #     would resolve to two paths.
      #   * cklint ignores `.civikitchen-siblings/` explicitly — phpcs has no
      #     such rule of its own, and a project phpcs.xml.dist scoped to
      #     `<file>.</file>` would otherwise lint the sibling's code.
      #
      # ssh-key is passed unconditionally: actions/checkout treats the empty
      # string as "not set" and falls back to the calling workflow's token,
      # which is the right behaviour for a public sibling.
      - name: Check out the sibling extension
        if: ${{ inputs.sibling_repo != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.sibling_repo }}
          ssh-key: ${{ secrets.sibling_deploy_key }}
          path: ${{ steps.sibling.outputs.path }}

      # The CI compose file is template-managed (ckinit checks it), so the
      # sibling cannot be written into it — the same bind this job's Playwright
      # counterpart is in, and the same way out: a compose override written
      # here, in $RUNNER_TEMP, layered on top for `up` only.
      #
      # Two merge rules decide what this file has to contain:
      #   * `volumes` is a LIST and merges by container path, so naming a new
      #     target appends to the stack's mounts. The extension's own mount is
      #     untouched.
      #   * `environment` is a MAPPING and merges per key — the override's
      #     value REPLACES the base file's for that key, it does not append to
      #     it. So CIVIKITCHEN_ENABLE_EXTENSIONS has to be written out in full,
      #     including the extension the template file already lists.
      # The sibling comes FIRST in that list: provision.sh enables the keys
      # left to right, and the extension that declares the requirement should
      # meet it already satisfied.
      #
      # Absolute host paths, because compose resolves relative ones against the
      # project directory — the directory of the FIRST -f file, i.e. .docker/,
      # not the workspace this override was written from.
      #
      # Mounted read-only and as is: no composer install runs in the sibling
      # (out of scope — that needs a key of its own), and read-only is what a
      # dependency you are not testing should be. The image's own
      # CIVIKITCHEN_AUTO_COMPOSER may log a warning if the sibling ships no
      # vendor/; it is a warning, not a failed boot.
      - name: Compose override — mount and enable the sibling
        if: ${{ inputs.sibling_repo != '' }}
        env:
          CK_SIBLING_DIR: ${{ steps.sibling.outputs.path }}
        run: |
          set -euo pipefail
          info="$GITHUB_WORKSPACE/$CK_SIBLING_DIR/info.xml"
          [ -f "$info" ] \
            || { echo "sibling_repo: no info.xml in $CK_SIBLING_DIR — that repo is not a CiviCRM extension" >&2; exit 1; }
          # The extension KEY, read from the sibling's own info.xml rather than
          # taken from the repo name or asked for as a second input: it is the
          # name CiviCRM registers the extension under, the name `cv ext:enable`
          # expects, and the directory a consuming phpstan.neon points its
          # scanDirectories at. A repo name is none of those and is free to
          # differ. Reading it costs one step and cannot go stale.
          sibling_key=$(tr '\n' ' ' < "$info" \
            | grep -o '<extension[^>]*key="[^"]*"' | head -1 \
            | sed 's/.*key="//; s/"$//')
          [[ "$sibling_key" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]] \
            || { echo "sibling_repo: could not read a usable extension key from $CK_SIBLING_DIR/info.xml (got: '$sibling_key')" >&2; exit 1; }
          echo "sibling extension: $sibling_key (from $CK_SIBLING_DIR)"
          override="$RUNNER_TEMP/civikitchen-sibling-override.yml"
          cat > "$override" <<YAML
          services:
            app:
              volumes:
                - $GITHUB_WORKSPACE/$CK_SIBLING_DIR:/var/www/html/ext/$sibling_key:ro
              environment:
                CIVIKITCHEN_ENABLE_EXTENSIONS: "$sibling_key,$CK_EXT_KEY"
          YAML
          echo "CK_SIBLING_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Composer install (private packages over SSH)
        if: ${{ inputs.composer_install }}
        env:
          CK_COMPOSER_DEPLOY_KEY: ${{ secrets.composer_deploy_key }}
        run: |
          set -euo pipefail
          # Branching on the secret in bash, not in the step's `if:` — the
          # `secrets` context is not available there. And an absent key is a
          # legitimate configuration: a repo can keep vendor/ out of git while
          # every package it requires is public.
          if [ -n "${CK_COMPOSER_DEPLOY_KEY:-}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            # printf, not echo: the key is multi-line and OpenSSH rejects it
            # without the trailing newline that a secret often loses.
            printf '%s\n' "$CK_COMPOSER_DEPLOY_KEY" > ~/.ssh/civikitchen_composer
            chmod 600 ~/.ssh/civikitchen_composer
            # Pin github.com's host key instead of turning host checking off:
            # this is a fresh runner with an empty known_hosts, and "accept
            # whatever answers" is how a credential ends up somewhere else.
            ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            # IdentitiesOnly: offer this key and nothing else. Without it ssh
            # walks the agent's keys first, so a *missing* grant on the deploy
            # key can pass on one runner and fail on another.
            printf 'Host github.com\n  IdentityFile ~/.ssh/civikitchen_composer\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          fi
          # No `composer update` and no --ignore-platform-reqs: the committed
          # lock is installed as it stands. It runs on the RUNNER's PHP though,
          # which is not the image's — a repo whose floor is above the runner's
          # PHP should pin `config.platform.php` in composer.json to the
          # version the extension actually runs on, which is the honest fix for
          # resolving against one PHP and executing on another anyway.
          composer install --no-dev --no-interaction --no-progress

      - name: Start CiviCRM stack
        id: stack
        run: |
          set -euo pipefail
          # Unchanged command when no sibling was checked out — CK_SIBLING_OVERRIDE
          # only exists once the step above wrote it. It is needed for `up`
          # alone: every later `docker compose exec` finds the stack through
          # the project name in the base file, same as in the Playwright job.
          compose=(-f "$CK_COMPOSE_FILE")
          if [ -n "${CK_SIBLING_OVERRIDE:-}" ]; then
            compose+=(-f "$CK_SIBLING_OVERRIDE")
          fi
          # Self-hosted runners keep the previous run's stack; without -v the
          # anonymous mariadb volume reattaches and the entrypoint skips install.
          docker compose "${compose[@]}" down -v --remove-orphans
          docker compose "${compose[@]}" up -d --wait --quiet-pull

      # The three gates below report INDEPENDENTLY (each runs as long as the
      # stack booted, red predecessors or not). Chained gates mask each other:
      # one fleet repo accumulated 53 phpstan errors across 48 commits because
      # phpstan sat behind a red lint gate and never executed — every gate you
      # skip on failure is a gate someone meets all at once later.
      - name: Lint (cklint + ckconform)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cklint --all && ckconform"

      # Formatting gate (mago for PHP, oxfmt for JS/TS). Hard by design: the
      # bundled mago baseline is tuned so its output is clean under the phpcs
      # standard cklint enforces, so the two gates agree by construction — a
      # red here means "run ckfmt and commit", never a style debate.
      - name: Format check (ckfmt)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && ckfmt --check"

      - name: PHPUnit + coverage floor
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && ckcoverage tests/phpunit"

      - name: PHPStan
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && phpstan analyse --no-progress"

      # Second, separate pass over tests/phpunit. The FILE is the switch —
      # there is no input to set: a repo whose test code is level-10 clean
      # commits phpstan-tests.neon.dist and the gate exists from that push on.
      # Until then the test-only rules (ck.test.*ddl*/InTransaction) see no
      # file at all, which is why the opt-in is worth having.
      - name: PHPStan (tests, opt-in)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && \
             if [ -f phpstan-tests.neon ]; then phpstan analyse -c phpstan-tests.neon --no-progress; \
             elif [ -f phpstan-tests.neon.dist ]; then phpstan analyse -c phpstan-tests.neon.dist --no-progress; \
             else echo 'no phpstan-tests.neon.dist — test analysis not enabled'; fi"

      # Runs on ONE PHP (the image's), which is exactly why this step exists: it
      # is the only gate that asks whether the code also runs on the LOWER bound
      # the extension promises in composer.json — a matrix of real interpreters
      # would cost a full stack per version to answer the same question.
      - name: PHP floor compatibility (ckcompat)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && ckcompat"

      # Passes silently for the many extensions that depend on core alone.
      - name: Dependency manifest (ckdeps)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && ckdeps"

      # Taint analysis (psalm, CiviCRM stubs) — an ADVISORY pilot, and the only
      # step in this workflow that cannot fail the run. Psalm sees the
      # extension but not CiviCRM core, so it both over-reports (a
      # 'Positive'-typed CRM_Utils_Request::retrieve is validated in reality)
      # and under-reports (anything crossing a hook, the API kernel or a Smarty
      # template). A finding is a prompt to look, not a verdict — the day the
      # signal proves itself, TaintedSql/Shell/Include/Unserialize/SSRF move
      # into the blocking set. docs/extension-standards.md has the details.
      # On an image older than cktaint the step reports "command not found" and
      # stays advisory, so the fleet needs no lockstep image bump.
      - name: Taint analysis (cktaint, advisory)
        id: cktaint
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        continue-on-error: true
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cktaint"

      - name: Taint analysis summary
        if: ${{ !cancelled() && steps.cktaint.outcome != 'skipped' }}
        run: |
          if [ "${{ steps.cktaint.outcome }}" = success ]; then
            echo "### Taint analysis (advisory): clean" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              # A non-zero exit is not necessarily a finding: an image without
              # cktaint, a broken config or an analyzer crash land here too, so
              # the summary must not claim taint flows were found.
              echo "### Taint analysis (advisory): findings or analysis failure"
              echo
              echo "\`cktaint\` exited non-zero — see the **Taint analysis (cktaint, advisory)** step log for"
              echo "whether it reported tainted data flows or failed to run at all."
              echo "**This did not fail the build.** The gate is an advisory pilot: Psalm cannot see CiviCRM core,"
              echo "so it over- and under-reports. For real findings, fix the flow or record a justified exception"
              echo "(\`cktaint --baseline\` / \`@psalm-suppress\` with a reason)."
              echo "See docs/extension-standards.md, section \"Taint analysis\"."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The runtime half of the Smarty story. ckconform's template checks are
      # static: they know a Page has no .tpl and that a `{ts}` is unscoped, and
      # they say so in their own headers that they cannot tell whether a
      # template COMPILES. That depends on the Smarty major this image ships,
      # on the prefilters CRM_Core_Smarty installs, and on which `{crm*}`
      # plugins are registered — including the ones the extension registers
      # itself. All three exist only in a booted site, which is what this job
      # already has.
      #
      # It also compiles the installed managed MessageTemplate BODIES, the one
      # artifact nothing else in this pipeline can see at all: a Smarty string
      # in the database, first compiled when the workflow fires, i.e. on a
      # production site at the moment someone donates.
      #
      # A step here rather than a job of its own precisely because the boot is
      # the expensive part and this job has already paid for it.
      - name: Smarty compile smoke (cksmarty)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cksmarty"

      # JS/TS linting with the image's pinned oxlint toolchain and the bundled
      # baseline config — the same arrangement as cklint and the bundled phpcs
      # standard, and for the same reason: eleven repos should not each carry
      # a linter devDependency block to drift.
      #
      # In the container, not on the runner, so it needs no Node setup step and
      # no npm install: the toolchain is already installed in the image. Passes
      # with a log line for the many extensions whose frontend is a couple of
      # Angular files or nothing at all.
      - name: JS/TS lint (ckeslint)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && ckeslint"

      # Same lifecycle block as the compat job below — deliberately duplicated
      # rather than factored out: a reusable workflow cannot share steps
      # between its own jobs. The substance lives in `cklifecycle` in the
      # image, which is also why this is two lines instead of twenty: the
      # sequence is only the setup, and the checks it exists for (post-uninstall
      # DB invariants, and a log scan so a swallowed SQL error cannot stay
      # green) need a booted site anyway.
      - name: Lifecycle smoke + gate (cklifecycle)
        id: lifecycle
        if: ${{ inputs.lifecycle }}
        run: |
          set -o pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cklifecycle" 2>&1 | tee /tmp/cklifecycle.md

      # The report is the point of the step, so it is published whether the
      # gate passed or failed — a leftover table named in a job summary gets
      # fixed, one buried 300 lines into a red step log does not.
      - name: Lifecycle summary
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        run: |
          sed -n '/^### Lifecycle gate/,$p' /tmp/cklifecycle.md >> "$GITHUB_STEP_SUMMARY" || true

      # A failed stack is a stack trace of nothing without its logs.
      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200

  # --- Upgrade from the last release (opt-in via upgrade_from_last_release) --
  #
  # A fresh install runs install(); an existing site runs upgrade_NNNN(). CI
  # has always tested the first and never the second, so an upgrader step that
  # references a column its own install() already creates looks fine forever.
  #
  # The trick that keeps this cheap: the stack bind-mounts the checkout, so
  # "install the old version" is a `git checkout` before `docker compose up`,
  # and "move to HEAD" is a second `git checkout` afterwards. No second stack,
  # no image build, no artifact shuffling.
  upgrade:
    if: ${{ inputs.upgrade_from_last_release }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
    steps:
      # See the note on the same step in `compat`. Extra reason here: this job
      # moves the working tree between two commits, and a vendor/ tree built on
      # the runner would silently stay the one built for HEAD while the stack
      # installs the previous release.
      - name: Reject the unsupported private-dependency combination
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        run: |
          echo "composer_install / sibling_repo are wired into the ci job only — this job would boot the extension without them. Turn this job off, or open an issue to have it wired up too." >&2
          exit 1

      # Full history: the previous release tag has to be checkoutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Newest tag reachable from this commit — on a PR that is the merge
      # commit, so it is the release the change would be shipped on top of.
      # Both failure modes get named instead of quietly skipping the job: a
      # repo with nothing to upgrade from should turn this input off, not
      # collect green runs that tested nothing.
      - name: Resolve the previous release
        id: prev
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          [ -n "$prev" ] \
            || { echo "no reachable tag: nothing has been released yet, so there is no upgrade path to test" >&2; exit 1; }
          git cat-file -e "$prev:$CK_COMPOSE_FILE" 2>/dev/null \
            || { echo "$prev predates $CK_COMPOSE_FILE — the release cannot boot its own stack; test the upgrade from the next release on" >&2; exit 1; }
          echo "previous release: $prev"
          {
            echo "prev=$prev"
            # What actions/checkout actually put in the tree (on a PR: the
            # merge commit) — the thing to come back to, resolved before
            # anything moves HEAD.
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the previous release into the mount
        run: git checkout --force --detach "$PREV"
        env:
          PREV: ${{ steps.prev.outputs.prev }}

      # Boots and installs the OLD version — including its own CI compose file
      # and therefore the image that release was tested with, unless the
      # caller pins `image`.
      - name: Start CiviCRM stack on the previous release
        run: |
          docker compose -f "$CK_COMPOSE_FILE" down -v --remove-orphans
          docker compose -f "$CK_COMPOSE_FILE" up -d --wait --quiet-pull

      # The container sees the checkout through the bind mount, so this alone
      # puts the new code in front of the installed old schema.
      - name: Move the mount to this commit
        run: git checkout --force --detach "$HEAD_REF"
        env:
          HEAD_REF: ${{ steps.prev.outputs.head }}

      - name: Upgrade the extension schema
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd /var/www/html/ext/$CK_EXT_KEY
             cv flush
             cv upgrade:db --mode=ext"
          pending=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cv ev 'echo CRM_Extension_Upgrades::hasPending() ? \"pending\" : \"clean\";'" \
            | tr -d '[:space:]')
          [ "$pending" = clean ] \
            || { echo "upgrade: extension upgrades still pending after cv upgrade:db" >&2; exit 1; }
          status=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cv ev 'echo CRM_Extension_System::singleton()->getManager()->getStatus(\"$CK_EXT_KEY\");'" \
            | tr -d '[:space:]')
          [ "$status" = installed ] \
            || { echo "upgrade: extension ended up '$status', expected 'installed'" >&2; exit 1; }

      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200

  # --- Schema parity (opt-in via schema_parity) -----------------------------
  #
  # The question the `upgrade` job leaves open. That one proves the upgrader
  # RUNS and leaves nothing pending. It cannot tell you whether it ARRIVES
  # where install() does — and install() and the upgrade_NNNN() chain are two
  # independent descriptions of the same schema with nothing keeping them in
  # step. NOT NULL in one and nullable in the other, varchar(64) here and
  # varchar(255) there, an index the installer creates and the upgrader forgets:
  # every fresh install is fine, every upgraded site is quietly different, and
  # no later upgrader will ever reconcile them because none of them knows.
  #
  # Two databases in one stack, in this order:
  #   B: install the last release, move the mount to HEAD, `cv upgrade:db` —
  #      literally the `upgrade` job, whose result is the upgraded schema;
  #   A: `down -v` and boot again on HEAD — a fresh install of this commit.
  # Then diff A against B over the extension's OWN tables. Core's tables are
  # not this extension's business and would drown the signal.
  #
  # mysqldump + a normalised text diff rather than Atlas — the reasoning is in
  # images/lib/ckschemadiff, short version: the CI stack publishes no database
  # port, so any tool has to run in the app container, and that container
  # already ships a mysql client.
  #
  # Two boots on one runner, so: scheduled caller, like every other opt-in job
  # here.
  schema-parity:
    if: ${{ inputs.schema_parity }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
    steps:
      # Same reasoning as in `upgrade`: this job moves the working tree between
      # two commits, so a vendor/ built once on the runner would belong to the
      # wrong one for half the job.
      - name: Reject the unsupported private-dependency combination
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        run: |
          echo "composer_install / sibling_repo are wired into the ci job only — this job would boot the extension without them. Turn this job off, or open an issue to have it wired up too." >&2
          exit 1

      # Full history: the previous release tag has to be checkoutable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Two cheap questions before anything boots, because the expensive part of
      # this job is two CiviCRM installs and neither is worth paying for if the
      # answer is already known. Both are SKIPS with a log line, not failures:
      # unlike `upgrade`, where a repo with no tag has switched on a check it
      # cannot satisfy, this job's preconditions are ordinary states for a
      # perfectly healthy extension — plenty of them own no tables at all, and
      # every repo has a first commit before its first release.
      #
      # The table question is answered from the repo's schema DECLARATIONS
      # (schema/*.entityType.php, xml/schema/**), which is also what the diff
      # later scopes itself to. Done in a plain grep here rather than by running
      # ckschemadiff: no container exists yet, and this only has to be right
      # about "any" versus "none".
      - name: Decide whether there is anything to compare
        id: gate
        run: |
          set -euo pipefail
          tables=0
          if compgen -G 'schema/*.entityType.php' > /dev/null \
            || { [ -d xml/schema ] && [ -n "$(find xml/schema -name '*.xml' -print -quit)" ]; }; then
            tables=1
          fi
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$tables" = 0 ]; then
            echo "schema parity: this extension declares no tables of its own (no schema/*.entityType.php, no xml/schema) — nothing to compare."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$prev" ]; then
            echo "schema parity: no reachable git tag — there is no released schema to upgrade from yet."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$prev:$CK_COMPOSE_FILE" 2>/dev/null; then
            echo "schema parity: $prev predates $CK_COMPOSE_FILE — that release cannot boot its own stack."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "schema parity: comparing a fresh install of HEAD against $prev upgraded to HEAD."
          {
            echo "run=true"
            echo "prev=$prev"
            # What actions/checkout put in the tree (on a PR: the merge commit),
            # resolved before anything moves HEAD.
            echo "head=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # --- B: the last release, upgraded to HEAD ---------------------------
      - name: Check the previous release into the mount
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: git checkout --force --detach "$PREV"
        env:
          PREV: ${{ steps.gate.outputs.prev }}

      - name: Start CiviCRM stack on the previous release
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" down -v --remove-orphans
          docker compose -f "$CK_COMPOSE_FILE" up -d --wait --quiet-pull

      - name: Move the mount to this commit
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: git checkout --force --detach "$HEAD_REF"
        env:
          HEAD_REF: ${{ steps.gate.outputs.head }}

      # `cv flush` first for the same reason the upgrade job does it: the boot
      # cached the OLD release's class and container maps, and the upgrader
      # about to run belongs to the new code.
      #
      # The dump has to leave the container before the next step destroys it,
      # and it leaves via `docker compose cp` rather than by being written into
      # the bind mount: the workspace belongs to the runner user, and this
      # command runs as www-data, which cannot write there.
      - name: Upgrade the extension schema and dump it
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd /var/www/html/ext/$CK_EXT_KEY
             cv flush
             cv upgrade:db --mode=ext
             ckschemadiff dump \"\${CIVICRM_DB_NAME:-civicrm}\" /tmp/ck-schema-upgraded.sql"
          docker compose -f "$CK_COMPOSE_FILE" cp \
            app:/tmp/ck-schema-upgraded.sql "$RUNNER_TEMP/ck-schema-upgraded.sql"

      # --- A: a fresh install of HEAD --------------------------------------
      #
      # `down -v` and not just `down`: the whole point is a database that has
      # never seen the old release. The CI stack gives mariadb an anonymous
      # volume, and -v is what guarantees it goes rather than being reattached.
      # The working tree is already at HEAD, so the boot installs this commit.
      - name: Reinstall from scratch on this commit
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" down -v
          docker compose -f "$CK_COMPOSE_FILE" up -d --wait --quiet-pull

      # The upgraded dump goes back INTO the new container rather than the diff
      # being run on the runner: `ckschemadiff diff` is where the explanation of
      # what a difference means lives, and duplicating that text into the
      # workflow is how the two versions of it start disagreeing.
      - name: Dump the freshly installed schema and compare
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" cp \
            "$RUNNER_TEMP/ck-schema-upgraded.sql" app:/tmp/ck-schema-upgraded.sql
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd /var/www/html/ext/$CK_EXT_KEY
             ckschemadiff dump \"\${CIVICRM_DB_NAME:-civicrm}\" /tmp/ck-schema-fresh.sql
             ckschemadiff diff /tmp/ck-schema-fresh.sql /tmp/ck-schema-upgraded.sql"

      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200

  # --- Mutation testing (opt-in via mutation) -------------------------------
  #
  # ckcoverage asks whether a line ran; this asks whether anything would have
  # noticed if the line were WRONG. Infection rewrites the code under the suite
  # and counts the mutants no test killed.
  #
  # Its own job, and off by default, for two reasons: a mutation run is a suite
  # run per mutant batch, and the score drifts with refactors that changed no
  # behaviour. As a push gate that is a slow, flappy build; as a scheduled one
  # it is a weekly reading. Belongs in the compat caller — see
  # docs/extension-standards.md.
  #
  # The floor is the repo's own (.ckconform: mutation_min_msi), so there is
  # nothing to configure here. Without that key ckmutate exits 0 with a line
  # saying so, which is what makes switching the input on safe before the
  # number is known.
  mutation:
    if: ${{ inputs.mutation }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
    steps:
      # Full history: without mutation_paths ckmutate mutates the lines changed
      # against CK_MUTATE_BASE, and a shallow clone has no base to diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      - name: Start CiviCRM stack
        id: stack
        run: |
          docker compose -f "$CK_COMPOSE_FILE" down -v --remove-orphans
          docker compose -f "$CK_COMPOSE_FILE" up -d --wait --quiet-pull

      # safe.directory first: the mount belongs to the runner user, and the
      # changed-lines mode (no mutation_paths) shells out to git as www-data.
      - name: Mutation testing (ckmutate)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "git config --global --add safe.directory /var/www/html/ext/$CK_EXT_KEY
             cd /var/www/html/ext/$CK_EXT_KEY && ckmutate"

      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200

  # --- Core upgrade persistence (opt-in via core_upgrade_from) --------------
  #
  # The job above, one axis over: that one moves the EXTENSION across a fixed
  # core, the compat matrix below moves the CORE but installs from scratch every
  # time. What neither reaches is the state every existing site is in — records
  # and configuration created on core N, and then the core underneath them
  # moves to N+1. That is where a managed entity reconciles differently after a
  # schema change, where a saved search's stored API params stop being valid,
  # where a custom field's column survives a core migration in name only.
  #
  # Same cheapness trick as the extension-upgrade job, one level up: the stack
  # takes its image from ${CIVIKITCHEN_IMAGE:-...}, so "swap the core" is one
  # environment variable and a second `up`. No second stack, no image build.
  #
  # Skipped entirely when the input is empty — the matrix_images deal: a caller
  # that never sets it pays nothing.
  core-upgrade:
    if: ${{ inputs.core_upgrade_from != '' }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      CK_CORE_FROM: ${{ inputs.core_upgrade_from }}
      # The job-level image is the upgrade TARGET: the run's normal image, or
      # empty for the compose file's own default. Only the first boot overrides
      # it — at the step — so everything after the swap already runs against the
      # image this pipeline actually tests on.
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
    steps:
      # See the note on the same step in `compat`. Extra reason here: this job's
      # override slot is taken by the two volumes that make the swap work.
      - name: Reject the unsupported private-dependency combination
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        run: |
          echo "composer_install / sibling_repo are wired into the ci job only — this job would boot the extension without them. Turn this job off, or open an issue to have it wired up too." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }
          # Same expression compat-images validates its CSV entries with: a
          # value that is not an image reference at all is a caller mistake
          # worth naming in seconds instead of ten minutes later in a pull error.
          [[ "$CK_CORE_FROM" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$ ]] \
            || { echo "core_upgrade_from is not an image reference: $CK_CORE_FROM" >&2; exit 1; }

      # The one thing that stops a naive image swap from being an upgrade.
      #
      # The entrypoint decides "is this site installed?" by looking for
      # /var/www/html/private/civicrm.settings.php, and that path lives in the
      # CONTAINER's own filesystem. Recreate the container on another image and
      # the settings file is gone, so with CIVICRM_AUTO_INSTALL=1 the entrypoint
      # runs `cv core:install -K` against a fully populated database instead of
      # upgrading it — a mess, not an upgrade.
      #
      # A named volume on that directory fixes it, and carries more than the
      # settings file: both provisioning markers (.civikitchen-configured,
      # .civikitchen-provisioned) live there too, so the new container also skips
      # the first-boot config and provisioning bundles — which would otherwise
      # re-run their cv calls against a database the new core has not upgraded
      # yet. What is left is exactly the state a real site is in mid-upgrade: new
      # core files, old database, the same settings file.
      #
      # The DATABASE needs a named volume of its own, and that is not optional
      # here: the template CI stack gives mariadb no volume at all, so its data
      # lives in an ANONYMOUS volume tied to the container. `docker compose down`
      # removes the container even without -v, the next `up` creates a fresh one
      # with a fresh anonymous volume — and the "old database" this whole job is
      # about would be an empty one. Naming it states the contract instead: the
      # containers go, the two volumes stay.
      #
      # Written here rather than into the template compose file for the same
      # reason the browser job writes its own: that file is template-managed
      # (ckinit checks it), and no repo should take drift — or a persistent
      # volume — for a job it may never switch on.
      #
      # Both merges only ever ADD: `volumes` under a service is a list that
      # merges by container path, and the top-level `volumes:` mapping merges by
      # key, so the extension's own bind mount and the db-init mount are
      # untouched. No host paths, so it does not matter that compose resolves
      # relative paths against the FIRST -f file's directory.
      - name: Compose override — carry the site and the database across the swap
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/civikitchen-core-upgrade-override.yml"
          cat > "$override" <<'YAML'
          services:
            app:
              volumes:
                - ck-core-upgrade-private:/var/www/html/private
            db:
              volumes:
                - ck-core-upgrade-db:/var/lib/mysql

          volumes:
            ck-core-upgrade-private:
            ck-core-upgrade-db:
          YAML
          echo "CK_UPGRADE_OVERRIDE=$override" >> "$GITHUB_ENV"

      # Booting IS the install on the old core: the entrypoint installs CiviCRM
      # and enables the mounted extension, on the version the site is meant to
      # have been living on.
      - name: Start the CiviCRM stack on the old core
        env:
          CIVIKITCHEN_IMAGE: ${{ inputs.core_upgrade_from }}
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" -f "$CK_UPGRADE_OVERRIDE" \
            down -v --remove-orphans
          docker compose -f "$CK_COMPOSE_FILE" -f "$CK_UPGRADE_OVERRIDE" \
            up -d --wait --quiet-pull

      # `cv scr`, not a PHPUnit class, and deliberately so: these assertions have
      # to run against the LIVE site database, while the headless harness points
      # CIVICRM_DSN at the isolated civicrm_test scratch DB. A phpunit-based
      # fixture would pass while testing a database the upgrade never touched.
      #
      # Both files are OPTIONAL. Without them this job still answers a real
      # question — does a site installed on the old core boot on the new one and
      # upgrade cleanly with this extension enabled — so refusing to run would
      # cost that answer for every repo that has not written fixtures yet. What
      # it cannot answer without them is what the extension's OWN data does,
      # which is why the skip says so in as many words rather than passing
      # quietly.
      - name: Seed the site on the old core (tests/upgrade/seed.php)
        run: |
          set -euo pipefail
          from_version=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cv ev 'echo CRM_Utils_System::version();'" | tr -d '[:space:]')
          echo "installed on CiviCRM $from_version ($CK_CORE_FROM)"
          # Read back after the upgrade to prove the core actually moved.
          echo "CK_CORE_FROM_VERSION=$from_version" >> "$GITHUB_ENV"
          if [ -f tests/upgrade/seed.php ]; then
            docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
              "set -e
               cd /var/www/html/ext/$CK_EXT_KEY
               cv scr tests/upgrade/seed.php"
          else
            echo "no tests/upgrade/seed.php: this run tests that the site boots on the new core and upgrades cleanly with $CK_EXT_KEY enabled — and nothing about the extension's own records."
            echo "Add tests/upgrade/seed.php + tests/upgrade/assert.php to test what your data does across the upgrade."
          fi

      # `down` without -v: the containers go, the two named volumes stay. That is
      # the deliberate spelling of what a second `up` would do on its own
      # (compose recreates `app` because its image changed) — written out, so the
      # scenario rests on the volumes rather than on compose's recreate
      # heuristics, and the database container genuinely restarts on the data it
      # already had.
      #
      # `--wait` is weaker on this boot than it looks: the image's health probe
      # is `test -f .civikitchen-provisioned`, and the volume has just carried
      # that marker across, so the container reports healthy as soon as it starts
      # rather than when the entrypoint has finished. It costs nothing here —
      # every step below talks to the stack through `docker compose exec`,
      # nothing speaks HTTP, and the second boot's entrypoint only skips through
      # its marker-gated bundles. Worth knowing before anything in this job is
      # ever pointed at the web server.
      - name: Swap the core underneath the site
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" -f "$CK_UPGRADE_OVERRIDE" down
          docker compose -f "$CK_COMPOSE_FILE" -f "$CK_UPGRADE_OVERRIDE" \
            up -d --wait --quiet-pull

      # `cv upgrade:db` straight away, with no `cv flush` in front of it: a
      # normal cv bootstrap against a database the code has not upgraded yet is
      # the thing to avoid here, and upgrade:db is the one command written for
      # exactly that state (it boots with CIVICRM_UPGRADE_ACTIVE). It runs core
      # and extension upgrades in one go, which is also what a real site's
      # upgrade does.
      #
      # Then four separate questions, because only asking all of them makes a
      # green run mean anything:
      #   * the database is at the code's version — the upgrade finished rather
      #     than stopping halfway with a zero exit;
      #   * that version is not the one the site was installed on — otherwise
      #     the caller pointed core_upgrade_from at the image the run already
      #     uses, and this job would be a slow way to test nothing;
      #   * no extension upgrade stayed pending — the same check the
      #     extension-upgrade job makes, and a core upgrade is a common way for
      #     one to appear;
      #   * the extension is still installed. Cheap, and it is what carries a
      #     run with no fixtures: a core upgrade that disables the extension
      #     (an unmet requirement on the new version, a failed upgrader) would
      #     otherwise leave every other check here perfectly green.
      - name: Upgrade the site database (cv upgrade:db)
        run: |
          set -euo pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "set -e
             cd /var/www/html/ext/$CK_EXT_KEY
             cv upgrade:db"
          versions=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cv ev 'echo CRM_Core_BAO_Domain::version(), \"|\", CRM_Utils_System::version();'" \
            | tr -d '[:space:]')
          db_version="${versions%%|*}"
          code_version="${versions##*|}"
          echo "core upgrade: $CK_CORE_FROM_VERSION -> $code_version (database at $db_version)"
          [ "$db_version" = "$code_version" ] \
            || { echo "core upgrade: database stayed at $db_version while the code is $code_version" >&2; exit 1; }
          [ "$code_version" != "$CK_CORE_FROM_VERSION" ] \
            || { echo "core upgrade: core_upgrade_from is CiviCRM $CK_CORE_FROM_VERSION, and so is the image this run tests on — point it at an OLDER minor, or turn the input off" >&2; exit 1; }
          pending=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cv ev 'echo CRM_Extension_Upgrades::hasPending() ? \"pending\" : \"clean\";'" \
            | tr -d '[:space:]')
          [ "$pending" = clean ] \
            || { echo "core upgrade: extension upgrades still pending after cv upgrade:db" >&2; exit 1; }
          status=$(docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cv ev 'echo CRM_Extension_System::singleton()->getManager()->getStatus(\"$CK_EXT_KEY\");'" \
            | tr -d '[:space:]')
          [ "$status" = installed ] \
            || { echo "core upgrade: extension ended up '$status', expected 'installed'" >&2; exit 1; }

      # Any exception or non-zero exit fails the job — that is the whole
      # contract, so an assertion is a `throw` and nothing has to be registered
      # anywhere.
      - name: Assert the seeded state survived (tests/upgrade/assert.php)
        run: |
          set -euo pipefail
          if [ -f tests/upgrade/assert.php ]; then
            docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
              "set -e
               cd /var/www/html/ext/$CK_EXT_KEY
               cv scr tests/upgrade/assert.php"
          else
            echo "no tests/upgrade/assert.php: the upgrade itself passed, but nothing checked what became of the extension's own records."
          fi

      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200

  # --- Compatibility matrix (opt-in via matrix_images) ----------------------
  #
  # Skipped entirely when matrix_images is empty: a skipped job costs no
  # runner minutes, so callers that never set the input keep today's run.
  #
  # A matrix needs a JSON array, and workflow expressions have no split(), so
  # the CSV is parsed here and handed on as `images`. Same shape as
  # build-dev-images.yml's resolve-civicrm job.
  compat-images:
    if: ${{ inputs.matrix_images != '' }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    outputs:
      images: ${{ steps.parse.outputs.images }}
    env:
      CK_MATRIX_IMAGES: ${{ inputs.matrix_images }}
    steps:
      - name: Parse matrix_images
        id: parse
        run: |
          set -euo pipefail
          images=$(jq -Rc 'split(",") | map(sub("^ +";"") | sub(" +$";"")) | map(select(length > 0))' \
            <<< "$CK_MATRIX_IMAGES")
          # Image refs go into `docker compose` through the environment, but a
          # value that is not an image reference at all is a caller mistake
          # worth naming here instead of ten minutes later in a pull error.
          jq -e 'all(test("^[A-Za-z0-9][A-Za-z0-9._/-]*(:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?$"))' \
            <<< "$images" > /dev/null \
            || { echo "matrix_images contains something that is not an image reference: $images" >&2; exit 1; }
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "compat matrix: $images"

  # One boot + suite per extra image. Deliberately NOT the full `ci` pass:
  # cklint, ckconform, phpstan and the coverage floor are enforced by the ck*
  # tools that ship *in the image*, so re-running them on a pinned older image
  # grades that image's tooling, not the extension. What is genuinely
  # version-dependent is whether the extension installs into that CiviCRM and
  # whether its tests pass there.
  compat:
    needs: compat-images
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    strategy:
      # One old CiviCRM failing must not hide the result for the new one.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.compat-images.outputs.images) }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      CIVIKITCHEN_IMAGE: ${{ matrix.image }}
    steps:
      # The private-dependency inputs are wired into the `ci` job only, and
      # this job boots the same stack from a plain checkout: without vendor/ or
      # the sibling it fails during the boot, in a way that reads like a broken
      # extension rather than a missing prerequisite. Say so instead — and say
      # it rather than skipping the job, because an opt-in check that quietly
      # tests nothing is the failure mode this file argues against everywhere
      # else. Wiring the extras up is a later step, not a reason to wait.
      - name: Reject the unsupported private-dependency combination
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        run: |
          echo "composer_install / sibling_repo are wired into the ci job only — this job would boot the extension without them. Turn this job off, or open an issue to have it wired up too." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Booting is itself the fresh-install test: the entrypoint installs
      # CiviCRM and enables the mounted extension, so an installer that fails
      # on this version never gets to the suite.
      - name: Start CiviCRM stack
        run: |
          docker compose -f "$CK_COMPOSE_FILE" down -v --remove-orphans
          docker compose -f "$CK_COMPOSE_FILE" up -d --wait --quiet-pull

      - name: PHPUnit
        run: |
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && CIVICRM_UF=UnitTests ckphpunit tests/phpunit"

      - name: Lifecycle smoke + gate (cklifecycle)
        id: lifecycle
        if: ${{ inputs.lifecycle }}
        run: |
          set -o pipefail
          docker compose -f "$CK_COMPOSE_FILE" exec -T -u www-data app bash -c \
            "cd /var/www/html/ext/$CK_EXT_KEY && cklifecycle" 2>&1 | tee /tmp/cklifecycle.md

      # The report is the point of the step, so it is published whether the
      # gate passed or failed — a leftover table named in a job summary gets
      # fixed, one buried 300 lines into a red step log does not.
      - name: Lifecycle summary
        if: ${{ !cancelled() && steps.lifecycle.outcome != 'skipped' }}
        run: |
          sed -n '/^### Lifecycle gate/,$p' /tmp/cklifecycle.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200

  # --- Browser tests (opt-in via playwright) --------------------------------
  #
  # examples/extension-with-playwright, promoted from a copy-paste starter to a
  # job: CiviCRM in Docker, the browser on the runner, the suite talking to
  # http://localhost:8080. Skipped entirely when the input is off, so callers
  # that never set it keep exactly the run they have — same deal as the compat
  # matrix.
  #
  # Its own job rather than more steps in `ci`: browsers, an npm tree and a
  # published port on every push run is the opposite of what the standards ask
  # of ci.yml, and a browser failure that also hides the PHPUnit result is a
  # bad trade. The suite is version-independent enough that this job runs once
  # on `image`, not per matrix entry — see the notes in
  # docs/extension-standards.md.
  playwright:
    if: ${{ inputs.playwright }}
    runs-on: ${{ inputs.runs_on || vars.CK_RUNS_ON || 'ubuntu-latest' }}
    env:
      CK_COMPOSE_FILE: ${{ inputs.compose_file }}
      CK_EXT_KEY: ${{ inputs.key }}
      CIVIKITCHEN_IMAGE: ${{ inputs.image }}
    steps:
      # See the note on the same step in `compat`: this job boots its own stack
      # from a plain checkout too, and its override slot is already taken by
      # the port and the demo user.
      - name: Reject the unsupported private-dependency combination
        if: ${{ inputs.composer_install || inputs.sibling_repo != '' }}
        run: |
          echo "composer_install / sibling_repo are wired into the ci job only — this job would boot the extension without them. Turn this job off, or open an issue to have it wired up too." >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          [[ "$CK_EXT_KEY" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]] \
            || { echo "invalid extension key: $CK_EXT_KEY" >&2; exit 1; }

      # Two things the CI stack deliberately lacks, added here instead of in
      # the template compose file — that one is template-managed, and no repo
      # should take drift (or a port, or a login user) for a job it may never
      # switch on:
      #   * a published port. The CI stack is only ever spoken to through
      #     `docker compose exec`, so nothing on it is reachable from the
      #     runner, where the browser lives.
      #   * a login user. CIVIKITCHEN_DEMO_USER is opt-in in the image; without
      #     it the site has an auth provider and no account to use it with.
      # Port 8080 is fixed, not an input: the template CI compose sets
      # CIVIKITCHEN_SITE_URL=http://localhost:8080 and CiviCRM bakes that into
      # every asset and redirect URL, so a site published on another port
      # serves pages pointing at one that isn't there.
      - name: Compose override — publish the port, create the demo user
        run: |
          set -euo pipefail
          override="$RUNNER_TEMP/civikitchen-playwright-override.yml"
          cat > "$override" <<'YAML'
          services:
            app:
              ports:
                - "8080:80"
              environment:
                CIVIKITCHEN_DEMO_USER: admin
                CIVIKITCHEN_DEMO_PASS: admin
          YAML
          echo "CK_PW_OVERRIDE=$override" >> "$GITHUB_ENV"

      - name: Start CiviCRM stack
        run: |
          docker compose -f "$CK_COMPOSE_FILE" -f "$CK_PW_OVERRIDE" \
            down -v --remove-orphans
          docker compose -f "$CK_COMPOSE_FILE" -f "$CK_PW_OVERRIDE" \
            up -d --wait --quiet-pull

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Same cache reasoning as the ci job: no package-lock.json to key on
          # when the repo is on Bun, and setup-node fails the step over it.
          node-version: ${{ inputs.node_version }}
          cache: ${{ !inputs.bun && 'npm' || '' }}

      - name: Set up Bun
        if: ${{ inputs.bun }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Same --ignore-scripts rule as the ci job: this job installs the
      # extension's own tree, and a browser test repo is exactly where an
      # install hook would go unnoticed. `bun` covers this job too — a repo
      # that resolves its dependencies one way in `ci` and the other way here
      # is testing two trees.
      - name: Materialize JS dependencies (npm ci / bun install)
        env:
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          if [ "$CK_USE_BUN" = true ]; then
            bun install --frozen-lockfile
          else
            npm ci --ignore-scripts
          fi

      # Browsers come from `playwright install`, never from the install hook
      # --ignore-scripts just skipped. No browser argument: which projects the
      # repo's playwright.config.ts declares is the repo's business, and a
      # missing webkit surfaces as a failing suite minutes into the run.
      #
      # Stays `npx` on the Bun path: this is not a package-manager operation
      # but the local node_modules/.bin/playwright binary, which either
      # manager has just put there.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright (npm run test:e2e / bun run test:e2e)
        env:
          # Read by the example config's `baseURL` and auth.setup.ts. Matches
          # CIVIKITCHEN_SITE_URL in the stack, which is what CiviCRM believes
          # it is served as.
          CIVICRM_BASE_URL: http://localhost:8080
          DEMO_USER: admin
          DEMO_PASS: admin
          CK_USE_BUN: ${{ inputs.bun }}
        run: |
          set -euo pipefail
          jq -e '.scripts["test:e2e"] // empty' package.json > /dev/null \
            || { echo "playwright is on but package.json declares no \"test:e2e\" script — that is the script this job runs" >&2; exit 1; }
          if [ "$CK_USE_BUN" = true ]; then
            bun run test:e2e
          else
            npm run test:e2e
          fi

      # A browser failure without its trace is a screenshot of nothing. Both
      # directories are Playwright defaults; `ignore` keeps a config that
      # writes elsewhere from turning a red suite into a red upload too.
      - name: Playwright report + traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ inputs.key }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # No override needed to find the stack: the project name comes from the
      # compose file, and this way the step still works when the failure was
      # the override step itself.
      - name: App logs on failure
        if: failure()
        run: docker compose -f "$CK_COMPOSE_FILE" logs app | tail -200
