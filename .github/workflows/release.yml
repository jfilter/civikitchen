# Cut a release: the workflow, the template, the ck* tools and the images ship
# as ONE versioned contract (docs/releases.md).
#
# Trigger: pushing a v<major>.<minor>.<patch> tag. Nothing is built here — the
# release attaches its tags to the image digests the moving tags (:standalone,
# :drupal10, …) already point at, i.e. to artifacts that have been through
# test-then-promote. In exchange it insists that those artifacts actually
# belong to the release commit: a promoted digest still carries its
# `…-<sha>` candidate tag, so the build commit is recoverable, and its
# `images/` tree must match the one being released.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v<major>.<minor>.<patch> tag to release (re-runnable)'
        required: true
        type: string
      allow_image_drift:
        description: >-
          Release although the live images were built from a commit whose
          images/ tree differs from this tag. Only for changes that provably
          cannot affect the built image (comments, docs under images/).
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/civikitchen
  PKG: civikitchen

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      major: ${{ steps.tag.outputs.major }}
      sha: ${{ steps.tag.outputs.sha }}

    steps:
      # fetch-depth 0: the release has to reach both its own history and the
      # main-branch commits the live images were built from.
      - name: Checkout the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version under release
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = workflow_dispatch ]; then TAG="${INPUT_TAG}"; else TAG="${REF_NAME}"; fi
          if ! [[ "${TAG}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: '${TAG}' (expected v<major>.<minor>.<patch>)" >&2
            exit 1
          fi
          # The dispatch path takes a tag NAME; make sure it is one, so a typo
          # cannot release whatever HEAD happens to be.
          git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null \
            || { echo "tag does not exist: ${TAG}" >&2; exit 1; }
          {
            echo "tag=${TAG}"
            echo "major=v${BASH_REMATCH[1]}"
            echo "sha=$(git rev-parse "refs/tags/${TAG}^{commit}")"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify the live image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          ALLOW_DRIFT: ${{ inputs.allow_image_drift && '1' || '0' }}
        run: |
          set -euo pipefail
          # --paginate concatenates one JSON array per page; --jq '.[]' streams
          # the elements so `jq -s` can make them one array again.
          gh api "/users/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
              --paginate --jq '.[]' | jq -s '.' > versions.json

          # The digest (GHCR calls it `name`) of the version carrying a tag.
          digest_of() {
            jq -r --arg t "$1" \
              'map(select(.metadata.container.tags | index($t))) | .[0].name // ""' versions.json
          }
          # A candidate tag left on that same digest, e.g. standalone-latest-<sha>.
          candidate_of() {
            jq -r --arg t "$1" '
              map(select(.metadata.container.tags | index($t)))
              | .[0].metadata.container.tags // []
              | map(select(test("-[0-9a-f]{40}$"))) | .[0] // ""' versions.json
          }

          RELEASE_TREE=$(git rev-parse "${RELEASE_SHA}:images")
          drift=()
          fatal=()
          : > digests.txt

          # Every published flavor. standalone leads because the unprefixed
          # :v1 / :v1.2.3 tags alias it — it is the image the extension
          # template's compose stacks run.
          for flavor in standalone drupal10 drupal11 wordpress joomla \
                        standalone-demo drupal10-demo drupal11-demo \
                        wordpress-demo joomla-demo; do
            digest=$(digest_of "${flavor}")
            if [ -z "${digest}" ]; then
              fatal+=("no published image behind :${flavor}")
              continue
            fi
            printf '%s\t%s\n' "${flavor}" "${digest}" >> digests.txt

            # Provenance: which commit was this digest built from, and does its
            # images/ tree match the release?
            candidate=$(candidate_of "${flavor}")
            build_sha="${candidate##*-}"
            if [ -z "${candidate}" ]; then
              echo "::warning::cannot tell which commit :${flavor} was built from (candidate tag already pruned)"
            elif ! git cat-file -e "${build_sha}^{commit}" 2>/dev/null; then
              echo "::warning::build commit ${build_sha} of :${flavor} is not in this checkout"
            elif [ "$(git rev-parse "${build_sha}:images")" != "${RELEASE_TREE}" ]; then
              drift+=(":${flavor} was built from ${build_sha:0:12}, whose images/ differs from ${TAG}")
            fi

            # Released patch tags are immutable. Re-running the same release is
            # fine (same digest); pointing v1.2.3 somewhere else is not.
            existing=$(digest_of "${flavor}-${TAG}")
            if [ -n "${existing}" ] && [ "${existing}" != "${digest}" ]; then
              fatal+=(":${flavor}-${TAG} is already published on another digest — cut a new patch version")
            fi
          done

          if [ ${#drift[@]} -gt 0 ]; then
            printf 'image drift: %s\n' "${drift[@]}" >&2
            if [ "${ALLOW_DRIFT}" = 1 ]; then
              echo "::warning::releasing anyway (allow_image_drift)"
            else
              echo "Wait for 'Build Dev Images' to promote this commit, or re-run this workflow with allow_image_drift." >&2
              exit 1
            fi
          fi
          if [ ${#fatal[@]} -gt 0 ]; then
            printf 'FATAL: %s\n' "${fatal[@]}" >&2
            exit 1
          fi
          cat digests.txt

      - name: Attach the release tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MAJOR: ${{ steps.tag.outputs.major }}
        run: |
          set -euo pipefail
          # imagetools create from a digest copies the manifest list intact, so
          # the release tags stay multi-arch — same mechanism as promote.
          while IFS=$'\t' read -r flavor digest; do
            echo "tagging ${flavor} (${digest}) as ${flavor}-${MAJOR} / ${flavor}-${TAG}"
            docker buildx imagetools create \
              -t "${IMAGE_PREFIX}:${flavor}-${MAJOR}" \
              -t "${IMAGE_PREFIX}:${flavor}-${TAG}" \
              "${IMAGE_PREFIX}@${digest}"
            if [ "${flavor}" = standalone ]; then
              # The contract image the extension template pins, unprefixed.
              docker buildx imagetools create \
                -t "${IMAGE_PREFIX}:${MAJOR}" \
                -t "${IMAGE_PREFIX}:${TAG}" \
                "${IMAGE_PREFIX}@${digest}"
            fi
          done < digests.txt

  git-tag:
    # Only after the images carry the release tags: the moving major ref must
    # never point at a commit whose images nobody can pull.
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The one checkout in this repo that keeps its credentials: the next step
      # force-pushes the moving major tag through the persisted git remote.
      - name: Checkout the tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.images.outputs.tag }}
          fetch-depth: 0

      - name: Move the major tag
        env:
          TAG: ${{ needs.images.outputs.tag }}
          MAJOR: ${{ needs.images.outputs.major }}
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
        run: |
          set -euo pipefail
          # A patch cut on an older line must not drag the major tag backwards.
          newest=$(git tag -l "${MAJOR}.*" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "${newest}" != "${TAG}" ]; then
            echo "${newest} is newer than ${TAG}; leaving ${MAJOR} where it is"
            exit 0
          fi
          git tag -f "${MAJOR}" "${RELEASE_SHA}"
          git push -f origin "refs/tags/${MAJOR}"
          echo "${MAJOR} -> ${RELEASE_SHA}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
