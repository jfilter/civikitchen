# Static checks for everything that has no compiler: shell scripts (strict
# shellcheck, style level), workflow files (actionlint, which also shellchecks
# embedded run blocks), PHP syntax for seeds/scripts, and profile.json shape.
# Runs on every push/PR — fast, no Docker, no build dependency.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: shellcheck (style level, fails on any finding)
        run: |
          # The ck* tools in images/lib carry no .sh suffix (they are commands on
          # PATH, not scripts you source), so a *.sh-only sweep silently skipped
          # every one of them — the shell in this repo that runs in the most
          # places. They are all clean; keep them that way.
          find images examples tools -name '*.sh' -print0 \
            | xargs -0 shellcheck -S style
          # -not -name '*.php': a ck* tool may have a PHP payload beside it,
          # and shellcheck handed a PHP file reports a hundred findings about a
          # file that is not shell at all. (cksmarty's payload is named
          # civikitchen-smarty-compile.php for the same reason — belt and
          # braces, because the next one will be named cksomething.php.)
          find images/lib -maxdepth 1 -type f -name 'ck*' -not -name '*.php' -print0 \
            | xargs -0 shellcheck -S style
          echo "shellcheck clean"

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 .
          ./actionlint -color

      - name: php -l (seeds + profile scripts + tools)
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || rc=1
          done < <(find images tools -name '*.php' -print0)
          [ "$rc" = 0 ] && echo "php syntax clean"

      # ckinit is what stamps the template into every extension repo, and its
      # --check mode gates those repos' CI — a silent regression here would
      # either rewrite files it must not touch or wave drift through.
      - name: ckinit integration checks
        run: bash tools/test-ckinit.sh

      # ckconform is the tool that tells eleven repos what is wrong with them,
      # and its 213 fixture tests ran nowhere but on a laptop. Most of its
      # checks are silent on success, so a rule that quietly stops matching
      # looks exactly like a clean repo — the tests are the only thing that
      # tells the difference. It has no composer dependencies, hence the phar.
      # The hook catalog is generated from core, so it rots on its own: core
      # adds hooks every release and a stale catalog reports them as typos.
      # HookCatalogDriftTest and CoreNamespaceCatalogDriftTest regenerate and
      # diff, but SKIP without a core checkout — so without this step the
      # suites go green while the gates never run. The namespace generator
      # scans the whole tree (CRM/, Civi/, ext/), so this fetches the source
      # tarball (~10 MB) rather than single files. Both catalogs must pin the
      # same release, or the two gates would silently test different cores.
      - name: fetch the core release the catalogs were generated from
        run: |
          ver=$(php -r 'require "images/ckconform/src/HookCatalog.php";
            echo CiviKitchen\Ckconform\HookCatalog::CORE_VERSION;')
          nsver=$(php -r 'require "images/lib/civikitchen-phpstan/src/CoreNamespaceCatalog.php";
            echo CiviKitchen\PHPStan\CoreNamespaceCatalog::CORE_VERSION;')
          if [ "$ver" != "$nsver" ]; then
            echo "catalog pins disagree: hooks=$ver namespaces=$nsver — regenerate both from one release" >&2
            exit 1
          fi
          echo "pinned CiviCRM $ver"
          curl -fsSLo /tmp/civicrm-core.tar.gz \
            "https://github.com/civicrm/civicrm-core/archive/refs/tags/$ver.tar.gz"
          mkdir -p /tmp/civicrm-core
          tar -xzf /tmp/civicrm-core.tar.gz -C /tmp/civicrm-core --strip-components=1

      - name: ckconform test suite
        env:
          CIVICRM_CORE_DIR: /tmp/civicrm-core
        run: |
          curl -fsSLo /tmp/phpunit.phar https://phar.phpunit.de/phpunit-9.6.35.phar
          php /tmp/phpunit.phar -c images/ckconform/phpunit.xml.dist

      # The namespace catalog feeds the phpat boundary rule in every repo's
      # phpstan run — a stale one flags new core components as foreign
      # extensions, fleet-wide.
      - name: civikitchen-phpstan test suite
        env:
          CIVICRM_CORE_DIR: /tmp/civicrm-core
        run: php /tmp/phpunit.phar -c images/lib/civikitchen-phpstan/phpunit.xml.dist

      - name: profile.json valid against schema
        # packages/civicrm-profile-schema/profile.schema.json is the canonical spec
        # for the profile format (draft 2020-12), published as @jfilter/civicrm-
        # profile-schema. It subsumes the old jq shape checks (description,
        # dependencies array, skipUf CIVICRM_UF enum) and adds real ones a key-blind
        # jq filter can't: additionalProperties:false catches typos (skipUF), repo/
        # registry are mutually exclusive, and version only pins a git `repo`.
        run: |
          pipx run check-jsonschema \
            --schemafile packages/civicrm-profile-schema/profile.schema.json \
            images/profiles/*/profile.json
