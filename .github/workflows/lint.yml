# Static checks and the fast test suites: everything that needs no Docker and
# no built image. Runs on every push/PR.
#
# The steps are `make` calls on purpose. What they run — which trees shellcheck
# sweeps, which CiviCRM release the catalog drift gates test against, which
# phpunit phar and which checksum — is defined once, in the Makefile and
# versions.env, so the same commands run here and on a laptop. Before that
# split these suites could be run in exactly one place: this file. Anything
# that belongs to "how a check runs" goes in the Makefile; what stays here is
# when it runs and with what permissions.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Reads the repo and nothing else; do not inherit the org default token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # shellcheck (style level, fails on any finding) + actionlint + zizmor
      # + php -l + the profile.json schema. actionlint's installer is piped
      # into bash, so the Makefile pins its content hash as well as its tag.
      - name: Static checks
        run: make lint

      # ckconform's fixtures, the phpstan extension's rule tests, and ckinit's
      # integration checks. `make test` fetches the CiviCRM source tree the
      # catalog drift gates need — without it those gates SKIP, and the suites
      # would go green while the thing they guard never ran.
      - name: Test suites
        run: make test
