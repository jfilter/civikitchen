# Keeps the pinned actions and the sidecar images of the example stacks
# current. Image contents (CiviCRM, buildkit, dev tools) track upstream through
# the daily rebuild; the PHP base image is a build arg and bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday

  # Sidecar images of the example stacks, the monorepo example and the
  # template's dev stack. One PR per image across all directories.
  - package-ecosystem: docker-compose
    directories:
      - /examples/*
      - /examples/monorepo/*/.docker
      - /scaffold/template/extension/.docker
    schedule:
      interval: weekly
      day: monday
    groups:
      sidecars:
        patterns: ["*"]
        group-by: dependency-name
    ignore:
      # The database tag is a compatibility decision taken against the database
      # matrix in build-dev-images.yml (docs/images.md), not a version bump.
      - dependency-name: mariadb
      # maildev 3 is a rewrite without the /healthz endpoint the stacks probe.
      - dependency-name: maildev/maildev
        update-types: ["version-update:semver-major"]
