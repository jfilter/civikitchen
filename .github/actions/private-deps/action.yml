name: CiviKitchen private dependencies
description: >-
  Sibling extension checkouts, the organisation policy defaults and the runner
  composer install — everything a stack boot needs before it starts. Writes
  the compose override that mounts and enables the siblings (output
  `sibling_override`); layer it with a second -f on `up`.

# Every job that boots a stack needs the same five steps, so they live here
# rather than once per job. A reusable workflow reaches its own repository by
# checking it out at `ref: ${{ job.workflow_sha }}` — `uses: ./…` alone
# resolves against the CALLING repository.
inputs:
  sibling_repo:
    description: Comma- or newline-separated extension repos (owner/repo).
    default: ''
  composer_install:
    description: Run `composer install` on the runner.
    default: 'false'
  policy_defaults:
    description: Repo (owner/repo) holding the organisation's civikitchen.yaml.
    default: ''
  composer_app_repositories:
    description: Repositories the minted app token may read.
    default: ''
  app_id:
    description: GitHub App ID (secrets.composer_app_id).
    default: ''
  app_private_key:
    description: GitHub App private key (secrets.composer_app_private_key).
    default: ''
  ext_key:
    description: This extension's key — the last entry of the enable list.
    required: true

outputs:
  sibling_override:
    description: >-
      Path of the compose override that mounts and enables the siblings, or
      empty when no sibling was configured. Layer it with a second -f on `up`.
    value: ${{ steps.override.outputs.file }}

runs:
  using: composite
  steps:
    # App credentials stay on the runner. Nothing here is mounted, copied or
    # passed into a container, and nothing echoes the token: the container
    # gets the *result* (a vendor/ directory, a checked-out sibling), never
    # the credential that produced it. A leaked build secret is otherwise the
    # one mistake in this pipeline that outlives the job — and an
    # installation token at least expires within the hour.
    #
    # One read token serves both the sibling checkout and composer: the app
    # is installed on every private dependency repo, so there is no
    # per-repo key to pick.
    #
    # Branching on the secret in bash, not in the step's `if:` — an absent app
    # is a legitimate configuration: a repo can keep vendor/ out of git while
    # every package it requires is public.
    - name: Decide whether a private-dependency token is needed
      id: need-token
      shell: bash
      env:
        CK_COMPOSER_APP_ID: ${{ inputs.app_id }}
        CK_COMPOSER_APP_PRIVATE_KEY: ${{ inputs.app_private_key }}
        CK_COMPOSER_APP_REPOSITORIES: ${{ inputs.composer_app_repositories }}
      run: |
        set -euo pipefail
        if [ -n "${CK_COMPOSER_APP_ID:-}" ] && [ -n "${CK_COMPOSER_APP_PRIVATE_KEY:-}" ]; then
          if [ -z "${CK_COMPOSER_APP_REPOSITORIES//[[:space:],]/}" ]; then
            echo "composer_app_repositories must list the repositories readable by the app token" >&2
            exit 1
          fi
          echo "app=true" >> "$GITHUB_OUTPUT"
        else
          echo "app=false" >> "$GITHUB_OUTPUT"
        fi

    # `repositories:` scopes the token to composer_app_repositories, the
    # caller-declared least-privilege set — never the app's full install.
    - name: Mint a read token for private dependencies
      id: app
      if: ${{ steps.need-token.outputs.app == 'true' }}
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        repositories: ${{ inputs.composer_app_repositories }}
        # The token only ever reads: a sibling checkout and composer's
        # private packages over HTTPS. Nothing here writes with it.
        permission-contents: read

    # Inside the workspace, like actions/checkout would — and the LEADING
    # DOT of the directory is load-bearing, twice over:
    #   * CiviCRM's extension scanner (CRM_Utils_File::findFiles, via
    #     CRM_Extension_Container_Basic) skips any directory whose name
    #     starts with a dot. Without that, a sibling would be discovered a
    #     second time *through the extension's own mount* and the same key
    #     would resolve to two paths.
    #   * cklint ignores `.civikitchen-siblings/` explicitly — phpcs has no
    #     such rule of its own, and a project phpcs.xml.dist scoped to
    #     `<file>.</file>` would otherwise lint the sibling's code.
    #
    # `git clone` in a loop rather than actions/checkout: an action cannot
    # run once per list entry, and keeping the action for the first repo
    # while cloning the rest would be two implementations of one step.
    #
    # The token is used unconditionally: without an app it is the calling
    # workflow's token, which is the right credential for a public sibling.
    - name: Check out the sibling extensions
      id: siblings
      if: ${{ inputs.sibling_repo != '' }}
      shell: bash
      env:
        CK_SIBLING_REPO: ${{ inputs.sibling_repo }}
        CK_SIBLING_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: |
        set -euo pipefail
        # Every entry has to be owner/repo — it becomes a clone target and a
        # path. Validated here as well as in the calling job: this action is
        # the only place that turns the value into a command.
        for repo in ${CK_SIBLING_REPO//,/ }; do
          [[ "$repo" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || { echo "invalid sibling_repo entry (expected owner/repo): $repo" >&2; exit 1; }
        done
        # `git -c` keeps the credential in this process: unlike a token in
        # the clone URL it never reaches the sibling's .git/config. Never
        # echoed either — base64 defeats the runner's secret masking.
        header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CK_SIBLING_TOKEN" | base64 | tr -d '\n')"
        paths=""
        for repo in ${CK_SIBLING_REPO//,/ }; do
          dir=".civikitchen-siblings/${repo##*/}"
          rm -rf "$dir"
          git -c "http.https://github.com/.extraheader=$header" \
            clone --quiet --depth 1 "https://github.com/$repo" "$dir"
          paths="${paths:+$paths }$dir"
        done
        echo "checked out siblings: $paths"
        echo "paths=$paths" >> "$GITHUB_OUTPUT"

    # The organisation's default civikitchen.yaml, next to the sibling for the
    # same two reasons (dot-prefixed: invisible to the extension scanner and
    # to cklint). It reaches ckconform through the extension's own mount.
    - name: Check out the organisation policy defaults
      if: ${{ inputs.policy_defaults != '' }}
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
        repository: ${{ inputs.policy_defaults }}
        token: ${{ steps.app.outputs.token || github.token }}
        path: .civikitchen-siblings/policy

    # The CI compose file is template-managed (ckinit checks it), so the
    # siblings cannot be written into it — the same bind the Playwright job is
    # in, and the same way out: a compose override written here, in
    # $RUNNER_TEMP, layered on top for `up` only.
    #
    # Two merge rules decide what this file has to contain:
    #   * `volumes` is a LIST and merges by container path, so naming a new
    #     target appends to the stack's mounts. The extension's own mount is
    #     untouched.
    #   * `environment` is a MAPPING and merges per key — the override's
    #     value REPLACES the base file's for that key, it does not append to
    #     it. So CIVIKITCHEN_ENABLE_EXTENSIONS has to be written out in full,
    #     including the extension the template file already lists.
    # The siblings come FIRST in that list, in input order: provision.sh
    # enables the keys left to right, and the extension that declares the
    # requirement should meet it already satisfied. A sibling required by
    # another sibling therefore has to be listed before it.
    #
    # Absolute host paths, because compose resolves relative ones against the
    # project directory — the directory of the FIRST -f file, i.e. .docker/,
    # not the workspace this override was written from.
    #
    # Read-only and as is: no composer install runs in the siblings. One that
    # ships no vendor/ makes CIVIKITCHEN_AUTO_COMPOSER log a warning — not a
    # failed boot.
    - name: Compose override — mount and enable the siblings
      id: override
      if: ${{ inputs.sibling_repo != '' }}
      shell: bash
      env:
        CK_SIBLING_DIRS: ${{ steps.siblings.outputs.paths }}
        CK_EXT_KEY: ${{ inputs.ext_key }}
      run: |
        set -euo pipefail
        mounts=""
        keys=""
        for dir in $CK_SIBLING_DIRS; do
          info="$GITHUB_WORKSPACE/$dir/info.xml"
          [ -f "$info" ] \
            || { echo "sibling_repo: no info.xml in $dir — that repo is not a CiviCRM extension" >&2; exit 1; }
          # The extension KEY, read from the sibling's own info.xml rather
          # than taken from the repo name or asked for as a second input: it
          # is the name CiviCRM registers the extension under, the name
          # `cv ext:enable` expects, and the directory a consuming
          # phpstan.neon points its scanDirectories at. A repo name is none
          # of those and is free to differ. It cannot go stale.
          # Parsed as XML, not with a tag-shaped regex: an attribute order or
          # a root element split over two lines is legal and would silently
          # yield an empty key. Same reader as the toolbelt's ck_xml_field —
          # inline, because this runs on the bare runner where the toolbelt
          # is not on PATH. php is preinstalled on the GitHub-hosted images.
          # shellcheck disable=SC2016  # the $vars belong to PHP, not the shell.
          sibling_key=$(php -r '
            libxml_use_internal_errors(TRUE);
            $xml = simplexml_load_file($argv[1]);
            if ($xml === FALSE) { fwrite(STDERR, "cannot parse {$argv[1]}\n"); exit(2); }
            echo trim((string) $xml["key"]);
          ' "$info")
          [[ "$sibling_key" =~ ^[A-Za-z][A-Za-z0-9._-]*$ ]] \
            || { echo "sibling_repo: could not read a usable extension key from $dir/info.xml (got: '$sibling_key')" >&2; exit 1; }
          echo "sibling extension: $sibling_key (from $dir)"
          mounts="$mounts      - $GITHUB_WORKSPACE/$dir:/var/www/html/ext/$sibling_key:ro"$'\n'
          keys="${keys:+$keys,}$sibling_key"
        done
        override="$RUNNER_TEMP/civikitchen-sibling-override.yml"
        # Assembled line by line, not from one heredoc: the mount list has as
        # many entries as the input had repos.
        {
          echo "services:"
          echo "  app:"
          echo "    volumes:"
          printf '%s' "$mounts"
          echo "    environment:"
          echo "      CIVIKITCHEN_ENABLE_EXTENSIONS: \"$keys,$CK_EXT_KEY\""
        } > "$override"
        echo "file=$override" >> "$GITHUB_OUTPUT"

    - name: Composer install (private packages over HTTPS)
      if: ${{ inputs.composer_install == 'true' }}
      shell: bash
      env:
        CK_COMPOSER_TOKEN: ${{ steps.app.outputs.token || github.token }}
      run: |
        set -euo pipefail
        # Composer's github-oauth config works for installation tokens too:
        # it becomes the Authorization header for https://github.com/... VCS
        # repositories and api.github.com dist downloads. Private packages
        # therefore have to be declared by HTTPS URL, not git@github.com:.
        # Written to the runner's global config, so a later `composer install`
        # in the same job — a tree that moved between two commits — is
        # authenticated without minting a second token.
        if [ -n "${CK_COMPOSER_TOKEN:-}" ]; then
          composer config -g github-oauth.github.com "$CK_COMPOSER_TOKEN"
        fi
        # No `composer update` and no --ignore-platform-reqs: the committed
        # lock is installed as it stands. It runs on the RUNNER's PHP though,
        # which is not the image's — a repo whose floor is above the runner's
        # PHP should pin `config.platform.php` in composer.json to the
        # version the extension actually runs on, which is the honest fix for
        # resolving against one PHP and executing on another anyway.
        # CI analyses repository tests as well as runtime code. Install the
        # locked development tree here; release packaging remains --no-dev.
        composer install --no-interaction --no-progress
