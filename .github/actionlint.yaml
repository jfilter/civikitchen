# actionlint's context types don't yet know the job.workflow_* properties
# GitHub shipped 2026-04 (rhysd/actionlint#707 unreleased). The reusable
# workflows use job.workflow_sha to pin their checkout of this repo; drop these
# ignores once an actionlint release accepts it.
paths:
  .github/workflows/extension-ci.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  .github/workflows/extension-release.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
